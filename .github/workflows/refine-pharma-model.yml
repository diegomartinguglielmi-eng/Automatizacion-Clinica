name: Refine pharma operating model
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refine-pharma-model.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace pharma model section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('<div id="p-mod" class="pharma-sub">')
          end=s.index('<div id="p-pen" class="pharma-sub">',start)
          new='''<div id="p-mod" class="pharma-sub"><div class="hero"><div class="eyebrow">MODELO OPERATIVO · HIPÓTESIS F1</div><h2>El sistema revisa el 100%; el farmacéutico interviene donde hay riesgo o excepción</h2><p>Modelo objetivo a validar: una primera capa digital integra prescripción y contexto clínico, ejecuta reglas, asigna riesgo y construye una worklist priorizada. La decisión farmacéutica queda concentrada en los episodios que requieren juicio profesional.</p><div class="flow"><span class="node">Prescripción</span><span class="arrow">→</span><span class="node">Contexto clínico + Lab</span><span class="arrow">→</span><span class="node">Reglas / CDSS</span><span class="arrow">→</span><span class="node">Risk Score</span><span class="arrow">→</span><span class="node">Worklist</span><span class="arrow">→</span><span class="node">Farmacéutico por excepción</span></div></div><div class="model-shell" style="margin-top:8px"><article class="model-wide"><h3>Dos vías después del screening</h3><div class="branch-flow"><div class="flow-entry"><span class="flow-pill">Orden válida</span><span class="flow-chevron">→</span><span class="flow-pill">Datos clínicos</span><span class="flow-chevron">→</span><span class="flow-pill ai">Motor clínico</span></div><div class="branch-paths"><div class="branch-row"><div class="branch-condition"><b>Vía principal</b>Bajo riesgo · datos completos · sin regla crítica</div><span class="flow-chevron">→</span><div class="branch-action">Continúa según gobernanza aprobada</div><span class="flow-chevron">→</span><div class="branch-result">Dispensación</div></div><div class="branch-row"><div class="branch-condition"><b>Vía de excepción</b>Alerta · alto riesgo · dato faltante · población especial</div><span class="flow-chevron">→</span><div class="branch-action">Worklist farmacéutica priorizada</div><span class="flow-chevron">→</span><div class="branch-result">Validar / intervenir</div></div></div></div><div class="model-note"><b>Gobernanza:</b> F1 no equivale a liberar automáticamente todas las órdenes. El PoC debe demostrar qué categorías pueden gestionarse por reglas, cuáles requieren revisión individual y cómo se documentan excepción, intervención y resolución.</div></article><div class="model-middle"><article class="model-block"><h3>Qué evalúa la primera capa</h3><div class="compact-list"><div class="compact-item"><b>Paciente</b>Edad, peso, alergias, diagnósticos y antecedentes relevantes.</div><div class="compact-item"><b>Orden</b>Fármaco, dosis, vía, frecuencia, duración y duplicidad.</div><div class="compact-item"><b>Laboratorio</b>Función renal/hepática y otros parámetros necesarios.</div><div class="compact-item"><b>Riesgo</b>Alto riesgo, interacciones, contraindicaciones y poblaciones especiales.</div></div></article><article class="model-block"><h3>Cuándo escala a Farmacia</h3><div class="trigger-list"><span class="trigger">Medicamento de alto riesgo</span><span class="trigger">Dosis fuera de regla</span><span class="trigger">Alergia / interacción relevante</span><span class="trigger">Ajuste renal/hepático</span><span class="trigger">Duplicidad</span><span class="trigger">Dato clínico faltante</span><span class="trigger">Pediatría / población especial</span><span class="trigger">Regla no concluyente</span></div></article><article class="model-block"><h3>Qué deja trazado</h3><div class="compact-list"><div class="compact-item"><b>Input</b>Orden y datos usados por el motor.</div><div class="compact-item"><b>Regla</b>Versión, hallazgo, severidad y score.</div><div class="compact-item"><b>Profesional</b>Validación, intervención, aclaración o escalamiento.</div><div class="compact-item"><b>Resolución</b>Aceptación, modificación, continuidad y timestamps.</div></div></article></div><div class="model-bottom"><article class="model-block"><h3>PoC · tres etapas y puertas de decisión</h3><div class="gate-grid"><div class="gate current"><b>1 · Shadow mode</b>Motor analiza órdenes sin cambiar el circuito actual.<span>Puerta: calidad de datos + sensibilidad de reglas + ruido de alertas.</span></div><div class="gate"><b>2 · Validación asistida</b>Farmacia mantiene revisión definida y usa score/worklist.<span>Puerta: seguridad + utilidad clínica + trazabilidad + carga real.</span></div><div class="gate"><b>3 · Gestión por riesgo</b>F1: intervención farmacéutica concentrada en excepciones aprobadas.<span>Decisión: avanzar, ajustar o detener según evidencia del PoC.</span></div></div></article><article class="model-block"><h3>Métricas del PoC <span class="prelim">metas a aprobar</span></h3><div class="threshold-grid"><div class="threshold"><span>Órdenes correctamente screenadas</span><b>Meta a validar</b></div><div class="threshold"><span>Eventos/alertas críticos detectados</span><b>Meta a validar</b></div><div class="threshold"><span>Alertas clínicamente útiles</span><b>Medir</b></div><div class="threshold"><span>% órdenes escaladas</span><b>KPI principal</b></div><div class="threshold"><span>Minutos farmacéuticos / prescripción</span><b>KPI principal</b></div><div class="threshold"><span>Aceptación de intervenciones</span><b>Medir</b></div><div class="threshold"><span>Tiempo hasta resolución</span><b>Baseline → PoC</b></div><div class="threshold"><span>Trazabilidad end-to-end</span><b>100% requerido</b></div></div></article></div></div><div class="portfolio-note"><b>Lectura para Otamendi:</b> el primer objetivo no es F0. Es demostrar un <b>F1 seguro y medible</b>: screening continuo, worklist por riesgo y farmacéutico concentrado en excepciones. Sólo después del PoC podrán definirse categorías de bajo riesgo candidatas a autoverificación selectiva.</div></div>'''
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Refine pharma operating model and PoC"
          git push
