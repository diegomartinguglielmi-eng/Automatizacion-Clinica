name: Build V4 dashboard
on:
  push:
    paths: ['.github/workflows/build-v4-dashboard.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          s=Path('mockup-v3.html').read_text(encoding='utf-8')
          s=s.replace('Mockup V3 · Automatización Clínica','Automatización Clínica | Sanatorio Otamendi').replace('● MOCKUP V3','TABLERO DE TRABAJO · V2.0')
          # Navegación: sumar simuladores como herramientas de decisión
          s=s.replace('<button data-v="tridata">Datos & métricas</button>','<button data-v="tridata">Datos & métricas</button><button data-v="trisim">Simulador de dotación</button>')
          s=s.replace('<button data-v="fardata">Datos & métricas</button>','<button data-v="fardata">Datos & métricas</button><button data-v="farsim">Simulador de dotación</button>')
          # CSS herramientas
          css='''<style id="v4-tools">.simulator{display:grid;grid-template-columns:.82fr 1.18fr;gap:9px;margin-top:8px}.simbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.simbox h3{margin:0 0 7px;color:var(--b);font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}.field{background:#fbf7f8;border:1px solid var(--line);border-radius:8px;padding:7px}.field label{display:block;font-size:7px;font-weight:800;color:#5d4f53;margin-bottom:3px}.field input{width:100%;border:1px solid #ddcfd2;border-radius:6px;padding:6px;color:var(--b);font-weight:900}.results{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.result{background:#edf8f3;border:1px solid #c9e8d9;border-radius:9px;padding:8px}.result strong{display:block;color:#126a48;font-size:18px}.result span{font-size:7px;color:#52665d}.range{margin-top:9px}.range input{width:100%}.scenario{margin-top:8px;font-size:8px;color:#65585c}.gatebar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.gateitem{border:1px solid var(--line);border-radius:8px;padding:7px;font-size:7px;background:#fff}.gateitem.done{background:#edf8f3;border-color:#c9e8d9}.gateitem.progress{background:#fff8e8;border-color:#ead8ad}.decisiongrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.decisioncard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px}.decisioncard b{color:var(--b);font-size:9px}.decisioncard p{font-size:7.5px;color:#66585c;margin:4px 0 0}.evidence-link{display:inline-block;margin-top:5px;color:var(--b);font-size:7.5px;font-weight:800;text-decoration:none}.embedlink{display:inline-block;background:var(--b);color:#fff;text-decoration:none;border-radius:7px;padding:6px 9px;font-size:8px;font-weight:800;margin-top:7px}@media(max-width:900px){.simulator,.decisiongrid{grid-template-columns:1fr}.results,.gatebar{grid-template-columns:1fr 1fr}}</style>'''
          s=s.replace('</head>',css+'</head>')
          # Decisiones abiertas en resumen
          marker='<div class="note"><b>Regla del tablero:'
          decisions='''<div class="decisiongrid"><div class="decisioncard"><b>DECISIÓN ABIERTA · TRIAGE</b><p>¿H1 es clínicamente seguro y operacionalmente viable para pasar a PoC controlado?</p><a class="evidence-link" href="#" data-go="triread">Ver readiness →</a></div><div class="decisioncard"><b>DECISIÓN ABIERTA · FARMACIA</b><p>¿Qué parte de F1 puede resolver ThinkSoft nativamente antes de sumar un motor especializado?</p><a class="evidence-link" href="#" data-go="farprov">Ver análisis tecnológico →</a></div></div>'''
          s=s.replace(marker,decisions+marker)
          # Simulador TRIAGE
          tri='''<section id="trisim" class="view"><h2 class="sectiontitle">TRIAGE IA · Simulador de demanda, autonomía y dotación</h2><div class="note"><b>Herramienta de escenario:</b> no representa una dotación recomendada. Permite estimar el efecto operativo de distintos niveles de intervención humana hasta contar con baseline y resultados de PoC.</div><div class="simulator"><div class="simbox"><h3>Variables del escenario</h3><div class="fields"><div class="field"><label>Pacientes / día</label><input id="tp" type="number" value="150"></div><div class="field"><label>Minutos de Enfermería / triage AS-IS</label><input id="tm" type="number" value="5" step="0.5"></div><div class="field"><label>% intervención humana H1</label><input id="th" type="number" value="25" min="0" max="100"></div><div class="field"><label>Horas útiles / FTE día</label><input id="tf" type="number" value="7" step="0.5"></div></div><div class="range"><label class="small">Autonomía: mover el porcentaje humano</label><input id="thr" type="range" min="0" max="100" value="25"></div></div><div class="simbox"><h3>Resultado operativo</h3><div class="results"><div class="result"><strong id="tas">—</strong><span>horas/día AS-IS</span></div><div class="result"><strong id="th1">—</strong><span>horas/día H1</span></div><div class="result"><strong id="tFte">—</strong><span>FTE equivalente H1</span></div><div class="result"><strong id="tRed">—</strong><span>reducción de horas</span></div></div><div class="scenario" id="ttext"></div></div></div></section>'''
          s=s.replace('<section id="triread" class="view">',tri+'<section id="triread" class="view">')
          # Simulador Farmacia
          far='''<section id="farsim" class="view"><h2 class="sectiontitle">Farmacia · Simulador de demanda, escalado y dotación</h2><div class="note"><b>Herramienta de escenario:</b> prescripciones/día y tiempos son hipótesis hasta completar el baseline de ThinkSoft. El resultado no constituye una recomendación de dotación.</div><div class="simulator"><div class="simbox"><h3>Variables del escenario</h3><div class="fields"><div class="field"><label>Prescripciones / día</label><input id="fp" type="number" value="600"></div><div class="field"><label>% escalado a Farmacia</label><input id="fh" type="number" value="30" min="0" max="100"></div><div class="field"><label>Minutos / intervención</label><input id="fm" type="number" value="7" step="0.5"></div><div class="field"><label>Horas útiles / FTE día</label><input id="ff" type="number" value="7" step="0.5"></div></div><div class="range"><label class="small">Escalado profesional</label><input id="fhr" type="range" min="0" max="100" value="30"></div></div><div class="simbox"><h3>Resultado operativo</h3><div class="results"><div class="result"><strong id="fesc">—</strong><span>prescripciones escaladas/día</span></div><div class="result"><strong id="fhrs">—</strong><span>horas farmacéuticas/día</span></div><div class="result"><strong id="fFte">—</strong><span>FTE equivalente</span></div><div class="result"><strong id="fAuto">—</strong><span>screening sin intervención</span></div></div><div class="scenario" id="ftext"></div></div></div></section>'''
          s=s.replace('<section id="farread" class="view">',far+'<section id="farread" class="view">')
          # Readiness: gate visual
          s=s.replace('<section id="triread" class="view"><h2 class="sectiontitle">TRIAGE IA · Readiness</h2>','<section id="triread" class="view"><h2 class="sectiontitle">TRIAGE IA · Readiness</h2><div class="gatebar"><div class="gateitem done">✓ Modelo H1</div><div class="gateitem progress">◐ Baseline</div><div class="gateitem progress">◐ Clínica</div><div class="gateitem">○ Integración</div><div class="gateitem">○ GO PoC</div></div>')
          s=s.replace('<section id="farread" class="view"><h2 class="sectiontitle">Farmacia · Readiness</h2>','<section id="farread" class="view"><h2 class="sectiontitle">Farmacia · Readiness</h2><div class="gatebar"><div class="gateitem done">✓ Modelo F1</div><div class="gateitem progress">◐ JCI/clínica</div><div class="gateitem">○ Baseline</div><div class="gateitem progress">◐ TS/datos</div><div class="gateitem">○ GO PoC</div></div>')
          # Links a matrices completas existentes
          s=s.replace('<div class="note">V3 agrega al análisis la calidad de evidencia:', '<a class="embedlink" href="benchmark-panel.html" target="_blank">Abrir benchmark completo TRIAGE ↗</a><div class="note">El análisis incorpora la calidad de evidencia:')
          s=s.replace('</div></section><section id="farprov"', '<a class="embedlink" href="pharma-matrix45.html" target="_blank">Abrir matriz completa · 45 casos ↗</a></div></section><section id="farprov"',1)
          # JS: títulos + calculadoras
          s=s.replace("tridata:['TRIAGE IA','Datos & métricas'],", "tridata:['TRIAGE IA','Datos & métricas'],trisim:['TRIAGE IA','Simulador de dotación'],")
          s=s.replace("fardata:['Validación Farmacoterapéutica','Datos & métricas'],", "fardata:['Validación Farmacoterapéutica','Datos & métricas'],farsim:['Validación Farmacoterapéutica','Simulador de dotación'],")
          calc='''function n(id){return +document.getElementById(id).value||0}function triCalc(){let p=n('tp'),m=n('tm'),h=n('th'),f=n('tf'),as=p*m/60,h1=as*h/100,fte=f?h1/f:0;tas.textContent=as.toFixed(1);th1.textContent=h1.toFixed(1);tFte.textContent=fte.toFixed(2);tRed.textContent=(as?((as-h1)/as*100):0).toFixed(0)+'%';ttext.textContent='Escenario: '+p+' pacientes/día; '+h+'% requiere intervención. El cálculo supone igual duración media por intervención y debe validarse con el baseline.';thr.value=h}function farCalc(){let p=n('fp'),h=n('fh'),m=n('fm'),f=n('ff'),e=p*h/100,hrs=e*m/60,fte=f?hrs/f:0;fesc.textContent=Math.round(e);fhrs.textContent=hrs.toFixed(1);fFte.textContent=fte.toFixed(2);fAuto.textContent=(100-h).toFixed(0)+'%';ftext.textContent='Escenario: '+p+' prescripciones/día; '+h+'% escala a Farmacia. Volumen y tiempo son hipótesis hasta medir ThinkSoft.';fhr.value=h}document.querySelectorAll('#tp,#tm,#th,#tf').forEach(x=>x.addEventListener('input',triCalc));document.querySelectorAll('#fp,#fh,#fm,#ff').forEach(x=>x.addEventListener('input',farCalc));thr.addEventListener('input',()=>{th.value=thr.value;triCalc()});fhr.addEventListener('input',()=>{fh.value=fhr.value;farCalc()});triCalc();farCalc();'''
          s=s.replace('</script></body>',calc+'</script></body>')
          Path('index.html').write_text(s,encoding='utf-8')
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish V4 dashboard with decision simulators and evidence layers' || exit 0
          git push
