name: Enhance pharma matrix filters and JCI badges
on:
  push:
    paths:
      - '.github/workflows/enhance-pharma-matrix-filters.yml'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance matrix
        shell: python
        run: |
          from pathlib import Path
          p=Path('pharma-matrix45.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.src a{color:var(--brand)}', '.src a{color:var(--brand)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 12px}.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:10px;color:#4d3c40}.filters input{min-width:230px}.jci-badge{display:inline-grid;place-items:center;width:25px;height:25px;margin-left:6px;border-radius:50%;vertical-align:middle;font-size:7px;font-weight:950;letter-spacing:-.03em;color:#745000;background:linear-gradient(#ffe889,#e6ad1d);border:1px solid #c28d0e;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}.count{font-size:10px;color:var(--muted);margin-left:auto;align-self:center}')
          marker='<div class="table"><table>'
          filters='''<div class="filters"><select id="regionFilter"><option value="">Todas las regiones</option><option>Argentina</option><option>LATAM</option><option>Internacional</option></select><select id="levelFilter"><option value="">Todos los niveles</option><option value="F0">F0 · Autoverificación</option><option value="F1">F1 · Priorización</option><option value="F2">F2 · Asistida</option><option value="F3">F3 · Digital sistemática</option><option value="F4">F4 · Manual</option></select><select id="jciFilter"><option value="">JCI + no JCI</option><option value="jci">Sólo JCI acreditadas / evidencia JCI</option><option value="nojci">Sin marca JCI</option></select><input id="searchFilter" placeholder="Buscar institución, país o modelo..."><span class="count" id="count"></span></div>'''
          s=s.replace(marker,filters+marker)
          old="document.getElementById('rows').innerHTML=cases.map((r,i)=>`<tr><td>${i+1}</td><td class=\"region\">${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td class=\"lvl\">${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td></tr>`).join('');"
          new="""const jciNames=new Set(['Hospital Universitario Austral','Hospital Israelita Albert Einstein','Hospital Sírio-Libanês','Fundación Santa Fe de Bogotá','Fundación Valle del Lili','Singapore General Hospital','Tan Tock Seng Hospital']);
const rows=document.getElementById('rows'),regionFilter=document.getElementById('regionFilter'),levelFilter=document.getElementById('levelFilter'),jciFilter=document.getElementById('jciFilter'),searchFilter=document.getElementById('searchFilter'),count=document.getElementById('count');
function render(){const q=searchFilter.value.trim().toLowerCase();const filtered=cases.filter(r=>{const isJci=jciNames.has(r[1]);return(!regionFilter.value||r[0]===regionFilter.value)&&(!levelFilter.value||r[3].startsWith(levelFilter.value))&&(!jciFilter.value||(jciFilter.value==='jci'?isJci:!isJci))&&(!q||r.join(' ').toLowerCase().includes(q))});rows.innerHTML=filtered.map(r=>{const i=cases.indexOf(r)+1,isJci=jciNames.has(r[1]);return `<tr><td>${i}</td><td class=\"region\">${r[0]}</td><td><b>${r[1]}</b>${isJci?'<span class=\"jci-badge\" title=\"JCI acreditada / evidencia oficial JCI\">JCI</span>':''}</td><td>${r[2]}</td><td class=\"lvl\">${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td></tr>`}).join('');count.textContent=`${filtered.length} de ${cases.length} casos`}
[regionFilter,levelFilter,jciFilter].forEach(x=>x.addEventListener('change',render));searchFilter.addEventListener('input',render);render();"""
          if old not in s: raise SystemExit('render marker not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pharma-matrix45.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add filters and JCI badges to pharma benchmark matrix'
          git push
