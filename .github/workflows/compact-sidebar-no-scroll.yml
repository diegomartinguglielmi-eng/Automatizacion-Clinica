name: Compact sidebar no scroll
on:
  push:
    paths: ['.github/workflows/compact-sidebar-no-scroll.yml']
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</style></head>'
          css='''<style id="sidebar-compact-v2">
          @media(min-width:1001px){
            .app{grid-template-columns:250px minmax(0,1fr)}
            .side{padding:7px 10px 8px;overflow:hidden}
            .logo-wrap{height:132px;flex:0 0 132px}
            .logo{width:132px;height:132px}
            .brand{font-size:17px;line-height:1}
            .project{font-size:8.5px;line-height:1.2;margin:4px 0 7px}
            .nav{overflow:hidden!important;padding-right:0;flex:1;min-height:0}
            .nav-title{font-size:8px;margin:6px 7px 2px;line-height:1.05}
            .nav button{width:calc(100% - 8px);padding:5px 7px;border-radius:8px;font-size:9.2px;line-height:1.05}
            .subnav{margin:0 0 2px 7px;padding-left:5px}
            .subnav button{font-size:8.7px;padding:4.5px 7px;width:calc(100% - 8px);line-height:1.05}
            .side-note{display:none!important}
          }
          @media(min-width:1001px) and (max-height:820px){
            .logo-wrap{height:108px;flex-basis:108px}.logo{width:108px;height:108px}
            .brand{font-size:15px}.project{font-size:7.8px;margin:3px 0 5px}
            .nav-title{font-size:7.4px;margin:4px 6px 1px}
            .nav button{padding:4px 6px;font-size:8.4px}
            .subnav{margin-left:6px}.subnav button{font-size:8px;padding:3.7px 6px}
          }
          </style>'''
          if 'id="sidebar-compact-v2"' not in s:
              s=s.replace(marker,css+marker)
          p.write_text(s,encoding='utf-8')
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact sidebar and remove footer note' || exit 0
          git push
