name: Build pharma benchmark cases
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-pharma-benchmark-cases.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace pharma benchmark
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('<div id="p-ben" class="pharma-sub">')
          end=s.index('<div id="p-prov" class="pharma-sub">', start)
          block='''<div id="p-ben" class="pharma-sub"><div class="hero"><div class="eyebrow">BENCHMARK · VALIDACIÓN FARMACOTERAPÉUTICA</div><h2>La brecha no es validar: es cuánto de la revisión puede priorizarse o automatizarse con seguridad</h2><p>Casos publicados de Argentina, Latinoamérica e internacionales, clasificados por nivel de automatización de la revisión de órdenes. La escala F0–F4 es analítica para este proyecto; no es una clasificación JCI.</p><div class="flow"><span class="node">F0 · Autoverificación selectiva</span><span class="arrow">→</span><span class="node">F1 · Priorización automatizada</span><span class="arrow">→</span><span class="node">F2 · Validación asistida</span><span class="arrow">→</span><span class="node">F3 · Validación digital sistemática</span><span class="arrow">→</span><span class="node">F4 · Predominio manual</span></div></div><div class="grid g4"><div class="p-card"><span class="tag">ARGENTINA</span><div class="metric">4</div><h3>casos documentados</h3><p>La evidencia encontrada confirma validación farmacéutica y prescripción electrónica, pero no autoverificación clínica productiva publicada.</p></div><div class="p-card"><span class="tag">LATAM</span><div class="metric">5</div><h3>casos / modelos</h3><p>Predomina la revisión por farmacéutico con soporte digital, protocolos y trazabilidad.</p></div><div class="p-card"><span class="tag">INTERNACIONAL</span><div class="metric">6</div><h3>casos faro</h3><p>Estados Unidos aporta precedentes productivos y PoC de autoverificación selectiva y estratificación de riesgo.</p></div><div class="p-card"><span class="tag">LECTURA</span><div class="metric">F0–F1</div><h3>frontera a explorar</h3><p>El objetivo no es eliminar al farmacéutico: es reservar su juicio para órdenes con riesgo, alertas o incertidumbre.</p></div></div><div class="model-wide" style="margin-top:9px"><h3>Escala de automatización · F0–F4</h3><div class="threshold-grid"><div class="threshold"><span><b>F0</b> · Autoverificación selectiva</span><span>farmacéutico por excepción</span></div><div class="threshold"><span><b>F1</b> · Priorización automatizada</span><span>sistema selecciona riesgo</span></div><div class="threshold"><span><b>F2</b> · Validación asistida</span><span>farmacéutico + reglas/alertas</span></div><div class="threshold"><span><b>F3</b> · Validación digital sistemática</span><span>farmacéutico revisa en sistema</span></div><div class="threshold"><span><b>F4</b> · Predominio manual</span><span>automatización no demostrada</span></div></div></div><div class="model-wide" style="margin-top:9px"><h3>Casos relevados</h3><div class="model-subtitle">Nivel asignado sólo cuando la publicación permite inferir el flujo. “No publicado” evita confundir digitalización con autonomía.</div><div class="table-wrap" style="max-height:calc(100vh - 470px);margin-top:8px"><table><thead><tr><th>Región</th><th>Institución / caso</th><th>Modelo documentado</th><th>Nivel</th><th>Dato útil</th><th>Lectura para Otamendi</th></tr></thead><tbody><tr><td>Argentina</td><td class="crit">Hospital Alemán · CABA</td><td>Farmacia Clínica 24×7; validación de prescripciones, dispensación y seguimiento.</td><td><span class="st part">F3</span></td><td>Cobertura 24×7 publicada.</td><td>Benchmark local directo para continuidad de cobertura.</td></tr><tr><td>Argentina</td><td class="crit">Hospital Privado Universitario de Córdoba</td><td>Validación farmacéutica sobre prescripción electrónica asistida.</td><td><span class="st part">F2</span></td><td>Errores detectados e intervenciones sobre CPOE.</td><td>Precedente argentino de soporte digital al farmacéutico.</td></tr><tr><td>Argentina</td><td class="crit">Hospital Público Materno Infantil · Salta</td><td>Validación farmacéutica sistemática de prescripciones.</td><td><span class="st part">F3</span></td><td>18.203 prescripciones validadas en el estudio.</td><td>Demuestra escala y valor de la revisión; automatización no publicada.</td></tr><tr><td>Argentina</td><td class="crit">AAFH · hospitales argentinos</td><td>Marco de buenas prácticas: alertas en prescripción electrónica y validación de medicamentos de alto riesgo.</td><td><span class="st na">Marco</span></td><td>Recomendación nacional, no caso único.</td><td>Base para reglas y lista de alto riesgo.</td></tr><tr><td>LATAM</td><td class="crit">Hospital Israelita Albert Einstein · Brasil</td><td>Farmacéutico clínico analiza prescripciones e interviene sobre pertinencia, dosis, vía, frecuencia y otros criterios.</td><td><span class="st part">F3</span></td><td>3.542 prescripciones; 1.238 intervenciones en UPA histórica.</td><td>Referencia regional de farmacia clínica intensiva.</td></tr><tr><td>LATAM</td><td class="crit">Hospital Alemão Oswaldo Cruz · Brasil</td><td>Prescripción electrónica + dispensarios electrónicos + doble chequeo y trazabilidad; farmacéutico valida prescripción.</td><td><span class="st part">F2</span></td><td>80% de demanda atendida en pisos mediante dispensarios integrados.</td><td>Buen caso de integración tecnología–farmacia–dispensación.</td></tr><tr><td>LATAM</td><td class="crit">Hospital Clínico UC-CHRISTUS · Chile</td><td>Proceso Estandarizado de Evaluación Farmacoterapéutica adaptado a recursos humanos y tecnológicos.</td><td><span class="st part">F3</span></td><td>420 camas; 4 farmacéuticos clínicos evaluados en el estudio.</td><td>Útil para diseñar priorización cuando el recurso es limitado.</td></tr><tr><td>LATAM</td><td class="crit">Hospital Nacional Docente Madre Niño San Bartolomé · Perú</td><td>Validación farmacéutica previa a dispensación en servicios seleccionados.</td><td><span class="st part">F4</span></td><td>Cobertura parcial documentada por servicios/turno.</td><td>Muestra el problema de cobertura cuando el modelo depende del recurso humano.</td></tr><tr><td>LATAM</td><td class="crit">Hospital Nacional Cayetano Heredia · Perú</td><td>Validación farmacéutica de tratamientos prescritos y dispensación individualizada.</td><td><span class="st part">F3</span></td><td>Servicio institucional consolidado; automatización no publicada.</td><td>Referencia regional de proceso, no de autonomía.</td></tr><tr><td>Internacional</td><td class="crit">UNC Health · EE.UU.</td><td>Framework de autoverificación con estratificación de riesgo.</td><td><span class="st ok">F0 · PoC</span></td><td>6,89% de todas las órdenes del mes clasificadas de bajo riesgo para AV en el PoC.</td><td>Modelo replicable para seleccionar un subconjunto seguro.</td></tr><tr><td>Internacional</td><td class="crit">University of Wisconsin Health · EE.UU.</td><td>Autoverificación productiva de medicamentos de bajo riesgo y alto volumen en Emergencias.</td><td><span class="st ok">F0</span></td><td>3.057/7.433 órdenes (41%) potencialmente autoverificables; 2 casos (0,07%) potencialmente inapropiados en revisión previa.</td><td>Caso faro para medir reducción de cola y seguridad.</td></tr><tr><td>Internacional</td><td class="crit">Johns Hopkins Hospital · EE.UU.</td><td>Rediseño de reglas y política de autoverificación alineadas con seguridad y regulación.</td><td><span class="st ok">F0</span></td><td>Algoritmo simplificado de 16 a 4 reglas/categorías.</td><td>Demuestra que gobernanza y mantenimiento de reglas son parte del producto.</td></tr><tr><td>Internacional</td><td class="crit">Massachusetts General / Brigham · EE.UU.</td><td>EHR integrado para aumentar revisión prospectiva por farmacéutico en Emergencias.</td><td><span class="st part">F2</span></td><td>Mejoró cobertura y eficiencia de revisión prospectiva.</td><td>Comparador de modelo asistido, no autónomo.</td></tr><tr><td>Internacional</td><td class="crit">ED académico + comunitario · EE.UU.</td><td>Autoverificación selectiva con exclusiones por alertas, función renal/hepática y contexto asistencial.</td><td><span class="st ok">F0</span></td><td>Reglas impiden AV ante alertas de dosis, alergia/interacción o datos faltantes.</td><td>Patrón técnico directamente trasladable a un PoC.</td></tr><tr><td>Internacional</td><td class="crit">Hospital pediátrico · EE.UU.</td><td>Órdenes que bypass de revisión farmacéutica analizadas retrospectivamente.</td><td><span class="st ok">F0</span></td><td>32.928/46.185 (71%) bypass; errores de dosis motivan controles específicos.</td><td>Advertencia: pediatría requiere reglas/exclusiones más estrictas.</td></tr></tbody></table></div></div><div class="model-bottom" style="margin-top:9px"><div class="model-block"><h3>Casos faro para el diseño Otamendi</h3><div class="compact-list"><div class="compact-item"><b>UNC Health</b>Seleccionar elegibilidad por riesgo clínico, no por volumen solamente.</div><div class="compact-item"><b>Wisconsin Health</b>Autoverificar sólo bajo riesgo/alto volumen con evaluación de seguridad previa.</div><div class="compact-item"><b>Johns Hopkins</b>Política, algoritmo, exclusiones y mantenimiento forman una sola gobernanza.</div><div class="compact-item"><b>Hospital Alemán</b>La comparación local relevante es cobertura 24×7 y continuidad del proceso.</div></div></div><div class="model-block"><h3>Hipótesis a probar</h3><div class="threshold-grid" style="grid-template-columns:1fr"><div class="threshold"><span>% órdenes elegibles para screening automático</span><b>Medir</b></div><div class="threshold"><span>% órdenes escaladas a farmacéutico</span><b>KPI</b></div><div class="threshold"><span>minutos farmacéuticos / prescripción</span><b>KPI</b></div><div class="threshold"><span>eventos / falsos negativos del filtro</span><b>Gate seguridad</b></div></div></div></div><div class="portfolio-note"><b>Lectura para Otamendi:</b> Argentina y LATAM demuestran que la validación farmacéutica es una práctica consolidada, pero la evidencia pública encontrada sigue concentrándose en revisión profesional asistida. Los precedentes internacionales muestran que un subconjunto de órdenes puede autoverificarse con reglas, exclusiones y monitoreo. El PoC debe determinar cuál es ese subconjunto en Otamendi, sin asumir de antemano un porcentaje.</div></div>'''
          p.write_text(s[:start]+block+s[end:])
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add real-world pharmacotherapy benchmark cases" || exit 0
          git push
