name: Restore detailed evidence and analysis v2.2
on:
  push:
    paths:
      - '.github/workflows/restore-analysis-detail-v22.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand evidence and analysis sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          sections={
          'triben':'''<section id="triben" class="view"><h2 class="sectiontitle">TRIAGE IA · Benchmark</h2><div class="hero"><div class="ey">BENCHMARK INTERNACIONAL · SÍNTESIS DE 45 CASOS</div><h2>La diferencia no está en digitalizar el triage, sino en el nivel de autonomía</h2><p>El benchmark compara cuánto de la primera clasificación puede resolverse sin intervención profesional obligatoria. Virtual no equivale a autónomo.</p><div class="flow"><span class="node">H0 · Autónomo</span><span class="node">H1 · Por excepción · OBJETIVO OTAMENDI</span><span class="node">H2 · Validación</span><span class="node">H3 · Asistido · PREDOMINIO REGIONAL</span><span class="node">H4 · Humano virtual</span></div></div><div class="g4"><div class="card"><span class="tag">01</span><h3>La autonomía es la brecha</h3><p>Argentina/LATAM se concentra en H2–H3. No confirmamos H0/H1 productivo en la muestra regional relevada.</p></div><div class="card"><span class="tag">02</span><h3>Virtual ≠ autónomo</h3><p>Digitalizar o hacer remoto el triage no implica eliminar la intervención profesional.</p></div><div class="card"><span class="tag">03</span><h3>Cambia el rol profesional</h3><p>En H0/H1 el profesional deja de intervenir sistemáticamente y se concentra en riesgo, excepción e incertidumbre.</p></div><div class="card"><span class="tag">04</span><h3>H1 tiene antecedentes</h3><p>Casos internacionales muestran una primera capa digital productiva con intervención humana por excepción.</p></div></div><div class="g3"><div class="block"><h3>Argentina + LATAM</h3><div class="metric">30</div><p>casos relevados · predominio H2–H3 · 0 H0/H1 productivos confirmados en la muestra.</p></div><div class="block"><h3>Internacional</h3><div class="metric">15</div><p>casos relevados · existen antecedentes productivos H0/H1.</p></div><div class="block"><h3>Casos faro</h3><p><b>Mount Sinai / Clearstep</b> · ≈22.000 triages.<br><b>Healthdirect / Infermedica</b> · ≈2M usos/año.<br><b>Sutter Health / Ada</b> · &gt;410.000 assessments.</p></div></div><div class="note"><b>Lectura para Otamendi:</b> evaluar H1 no significa eliminar el control profesional, sino desplazarlo hacia los episodios que realmente requieren juicio clínico.</div><a class="embedlink" href="matrix45.html" target="_blank">Ver matriz completa · 45 casos ↗</a></section>''',
          'triprov':'''<section id="triprov" class="view"><h2 class="sectiontitle">TRIAGE IA · Proveedores</h2><div class="hero"><div class="ey">COMPARATIVA TECNOLÓGICA · OBJETIVO H1</div><h2>¿Qué solución puede acercar a Otamendi a una primera capa digital con intervención por excepción?</h2><p>La evaluación separa capacidad declarada de evidencia productiva. La autonomía real debe demostrarse en el contexto de Otamendi.</p></div><div class="table"><table><tr><th>Proveedor</th><th>Perfil / nivel observado</th><th>Intervención profesional</th><th>Evidencia</th><th>Brecha para Otamendi</th></tr><tr><td><b>TrIAge / Oops</b></td><td>Triage digital · H2 actual</td><td>Validación profesional de clasificación</td><td class="part">◐ Regional</td><td>Demostrar H1 productivo</td></tr><tr><td><b>Knidian</b></td><td>CDS clínico · H2/H3</td><td>Revisión clínica</td><td class="part">◐ A validar</td><td>No es autonomía H1 demostrada</td></tr><tr><td><b>Guardia Virtual</b></td><td>IA + NLP + cinco niveles</td><td>Modelo publicado requiere validación</td><td class="part">◐ A validar</td><td>Autonomía, métricas e integración</td></tr><tr><td><b>ÜMA</b></td><td>Automatización de triage digital</td><td>Modelo específico hospitalario a validar</td><td class="part">◐ Escala digital</td><td>Demostrar H1 en urgencias hospitalarias</td></tr><tr><td><b>Certuma</b></td><td>Screening conversacional + red flags</td><td>Escalamiento</td><td class="part">◐ A validar</td><td>Evidencia hospitalaria productiva</td></tr></table></div><div class="g3"><div class="card"><h3>Autonomía</h3><p>Nivel H0–H4 y porcentaje real de episodios que requieren profesional.</p></div><div class="card"><h3>Seguridad</h3><p>Red flags, under/over-triage, poblaciones excluidas y reglas de escalamiento.</p></div><div class="card"><h3>Integración & economía</h3><p>HIS, APIs, trazabilidad, setup, run, variable y costo humano residual.</p></div></div><div class="note"><b>Criterio de selección:</b> no alcanza con “tener IA”. El proveedor debe demostrar autonomía segura, trazabilidad, integración y economía compatible con H1.</div></section>''',
          'tripoc':'''<section id="tripoc" class="view"><h2 class="sectiontitle">TRIAGE IA · Modelo operativo & PoC</h2><div class="hero"><div class="ey">CIRCUITO OBJETIVO H1</div><h2>La IA opera como primera capa; Enfermería interviene por excepción</h2><div class="flow"><span class="node">Paciente / tótem</span><span class="arr">→</span><span class="node">Captura clínica</span><span class="arr">→</span><span class="node">IA + reglas</span><span class="arr">→</span><span class="node">Prioridad / riesgo</span><span class="arr">→</span><span class="node">Vía principal o excepción</span><span class="arr">→</span><span class="node">Médico</span></div></div><div class="g2"><div class="block"><span class="tag">VÍA PRINCIPAL</span><h3>Sin criterio de excepción</h3><p>Datos completos, sin red flags, confianza suficiente y categoría habilitada → continúa según gobernanza aprobada, sin intervención sistemática de Enfermería.</p></div><div class="block"><span class="tag">VÍA DE EXCEPCIÓN</span><h3>Requiere juicio profesional</h3><p>Red flag, alta prioridad, datos faltantes, incertidumbre, población especial o discrepancia → worklist priorizada de Enfermería.</p></div></div><div class="g3"><div class="card"><h3>1 · Shadow mode</h3><p>IA clasifica en paralelo sin modificar el circuito. Se mide concordancia, seguridad, excepciones y tiempos.</p></div><div class="card"><h3>2 · Validación controlada</h3><p>Enfermería valida la salida y se identifican categorías y reglas candidatas a H1.</p></div><div class="card"><h3>3 · H1 controlado</h3><p>Intervención por excepción solo en categorías previamente aprobadas y con trazabilidad completa.</p></div></div><div class="table"><table><tr><th>Métrica PoC</th><th>Qué responde</th></tr><tr><td>% intervención humana</td><td>Autonomía operativa real</td></tr><tr><td>Minutos profesionales / episodio</td><td>Carga de Enfermería</td></tr><tr><td>Concordancia / under-triage / over-triage</td><td>Seguridad clínica</td></tr><tr><td>Tiempo hasta clasificación</td><td>Impacto en flujo</td></tr><tr><td>% excepciones por causa</td><td>Dónde falla o requiere juicio</td></tr></table></div><div class="note"><b>Gobernanza:</b> H1 no elimina la responsabilidad clínica posterior. Cambia el punto de intervención de Enfermería y exige reconstruir input, reglas, score, excepción, profesional y timestamps.</div></section>''',
          'farben':'''<section id="farben" class="view"><h2 class="sectiontitle">Farmacia · Benchmark</h2><div class="hero"><div class="ey">BENCHMARK · VALIDACIÓN FARMACOTERAPÉUTICA</div><h2>La oportunidad está en pasar de revisar todo igual a priorizar según riesgo</h2><p>Escala analítica F0–F4 para comparar cuánto trabajo puede resolver una primera capa electrónica antes del juicio farmacéutico.</p><div class="flow"><span class="node">F0 · Autoverificación selectiva</span><span class="node">F1 · Priorización automatizada · OBJETIVO</span><span class="node">F2 · Validación asistida</span><span class="node">F3 · Validación farmacéutica digital</span><span class="node">F4 · Predominio manual</span></div></div><div class="g3"><div class="block"><h3>Argentina</h3><p>Experiencias publicadas muestran validación farmacéutica electrónica e intervenciones clínicas; no equivalen por sí mismas a F0/F1.</p></div><div class="block"><h3>LATAM</h3><p>Casos como Einstein y UC CHRISTUS aportan evidencia sobre intervención farmacéutica y soporte electrónico.</p></div><div class="block"><h3>Internacional</h3><p>ASHP y experiencias como UNC, Wisconsin y Mayo muestran autoverificación o priorización selectiva bajo reglas y gobernanza.</p></div></div><div class="g3"><div class="card"><h3>UNC Health</h3><p>PoC de órdenes de bajo riesgo candidatas a autoverificación. La selección es acotada y gobernada.</p></div><div class="card"><h3>Estudio ED</h3><p>7.433 órdenes analizadas; 3.057 (41%) potencialmente autoverificables en la población estudiada.</p></div><div class="card"><h3>ASHP</h3><p>La autoverificación existe como práctica hospitalaria, pero requiere criterios, monitoreo y exclusiones.</p></div></div><div class="note"><b>Lectura para Otamendi:</b> el PoC debe medir qué proporción puede ser gestionada por la primera capa de forma segura y qué proporción realmente requiere intervención farmacéutica.</div><a class="embedlink" href="pharma-matrix45.html" target="_blank">Ver matriz completa · 45 casos ↗</a></section>''',
          'farprov':'''<section id="farprov" class="view"><h2 class="sectiontitle">Farmacia · Proveedores y tecnología</h2><div class="hero"><div class="ey">DECISIÓN TECNOLÓGICA</div><h2>Primero ThinkSoft: medir la brecha antes de incorporar otra plataforma</h2><p>La evaluación no parte de la necesidad de comprar un motor externo. Parte de determinar cuánto del modelo F1 puede resolver el HIS actual con seguridad y trazabilidad.</p></div><div class="g2"><div class="block"><span class="tag">OPCIÓN 0</span><h3>ThinkSoft nativo</h3><p>Validar screening de órdenes, reglas/CDS, alergias, interacciones, duplicidad, dosis, contexto renal/hepático, worklist, documentación y audit trail.</p></div><div class="block"><span class="tag">OPCIÓN 1</span><h3>ThinkSoft + motor especializado</h3><p>Agregar una capa solo si existe una brecha funcional, clínica o de priorización que justifique complejidad, costo e integración adicional.</p></div></div><div class="table"><table><tr><th>Capacidad a evaluar</th><th>TS</th><th>Motor especializado</th><th>Evidencia requerida</th></tr><tr><td>Screening de órdenes</td><td class="part">◐ A validar</td><td>Disponible según producto</td><td>Demo con casos Otamendi</td></tr><tr><td>Dosis / renal / hepático</td><td class="part">◐ A validar</td><td>Variable</td><td>Reglas + datos necesarios</td></tr><tr><td>Alergias / interacciones / duplicidad</td><td class="part">◐ A validar</td><td>Habitual en CDS</td><td>Sensibilidad y fatiga de alertas</td></tr><tr><td>Priorización / worklist</td><td class="part">◐ A validar</td><td>Capacidad diferencial</td><td>Risk score explicable</td></tr><tr><td>Trazabilidad</td><td class="part">◐ A validar</td><td>Obligatoria</td><td>Reconstrucción end-to-end</td></tr><tr><td>Integración</td><td class="ok">✓ HIS actual</td><td>Requiere interfaz</td><td>HL7/FHIR/API y latencia</td></tr></table></div><div class="g3"><div class="card"><h3>CDS / contenido</h3><p>Medi-Span, First Databank, Lexidrug y alternativas deben evaluarse por contenido, reglas e integración, no solo por catálogo.</p></div><div class="card"><h3>Plataformas</h3><p>Sentri7, BD, Oracle/Cerner u otras solo son comparables si cubren el flujo objetivo y cuentan con evidencia aplicable.</p></div><div class="card"><h3>Economía</h3><p>Comparar setup + run + integración + variable + horas farmacéuticas residuales.</p></div></div></section>''',
          'dem':'''<section id="dem" class="view"><h2 class="sectiontitle">Farmacia · Demanda & dimensionamiento</h2><div class="hero"><div class="ey">BASELINE OPERATIVO</div><h2>Antes de dimensionar dotación necesitamos medir la demanda real de prescripciones</h2><p>La referencia institucional conocida es 130 camas, 72 críticas y una cobertura inicial L–V 07–21. El volumen de prescripciones y los tiempos reales siguen pendientes de baseline.</p></div><div class="g4"><div class="card"><div class="metric">130</div><p>camas</p></div><div class="card"><div class="metric">72</div><p>camas críticas</p></div><div class="card"><div class="metric">07–21</div><p>cobertura inicial L–V</p></div><div class="card"><div class="metric">24/7</div><p>objetivo de cobertura del sistema</p></div></div><div class="table"><table><tr><th>Variable baseline</th><th>Estado</th><th>Uso</th></tr><tr><td>Prescripciones / día</td><td class="pend">○ Pendiente</td><td>Volumen base</td></tr><tr><td>Órdenes / paciente / día</td><td class="pend">○ Pendiente</td><td>Normalizar demanda</td></tr><tr><td>P90 horario</td><td class="pend">○ Pendiente</td><td>Dimensionar pico</td></tr><tr><td>Críticas vs no críticas</td><td class="pend">○ Pendiente</td><td>Priorización</td></tr><tr><td>Minutos farmacéuticos / intervención</td><td class="pend">○ Pendiente</td><td>FTE</td></tr><tr><td>Intervenciones y severidad</td><td class="pend">○ Pendiente</td><td>Valor clínico</td></tr></table></div><div class="note"><b>Principio:</b> no preguntar solo “¿cuántos farmacéuticos necesito para revisar todo?”, sino “¿qué porcentaje necesita juicio farmacéutico y cuántos minutos consume?”. El simulador del tablero trabaja con hipótesis hasta completar este baseline.</div></section>''',
          'farpoc':'''<section id="farpoc" class="view"><h2 class="sectiontitle">Farmacia · Modelo operativo & PoC</h2><div class="hero"><div class="ey">MODELO OPERATIVO · HIPÓTESIS F1</div><h2>El sistema revisa el 100%; el farmacéutico interviene donde hay riesgo o excepción</h2><div class="flow"><span class="node">Prescripción</span><span class="arr">→</span><span class="node">Contexto clínico + Lab</span><span class="arr">→</span><span class="node">Reglas / CDSS</span><span class="arr">→</span><span class="node">Risk score</span><span class="arr">→</span><span class="node">Worklist</span><span class="arr">→</span><span class="node">Farmacéutico por excepción</span></div></div><div class="g2"><div class="block"><span class="tag">VÍA PRINCIPAL</span><h3>Bajo riesgo + datos completos</h3><p>Sin regla crítica, sin población excluida y con información suficiente → continúa según gobernanza aprobada. F1 no implica liberar automáticamente todas las órdenes.</p></div><div class="block"><span class="tag">EXCEPCIÓN</span><h3>Alerta, riesgo o incertidumbre</h3><p>Alto riesgo, interacción relevante, ajuste requerido, dato faltante, población especial o regla crítica → worklist farmacéutica priorizada.</p></div></div><div class="g3"><div class="card"><h3>1 · Shadow mode</h3><p>El motor clasifica sin alterar el proceso. Se compara contra la revisión farmacéutica real.</p></div><div class="card"><h3>2 · Validación asistida</h3><p>La priorización guía la cola; Farmacia mantiene la decisión y se mide precisión, carga e intervenciones.</p></div><div class="card"><h3>3 · Gestión por riesgo</h3><p>F1 para categorías aprobadas, con exclusiones, contingencia y trazabilidad completa.</p></div></div><div class="table"><table><tr><th>Métrica PoC</th><th>Objetivo</th></tr><tr><td>% prescripciones escaladas</td><td>Medir intervención farmacéutica real</td></tr><tr><td>Minutos / prescripción</td><td>Medir carga profesional</td></tr><tr><td>Intervenciones / severidad / aceptación</td><td>Medir valor clínico</td></tr><tr><td>Alertas críticas detectadas</td><td>Seguridad</td></tr><tr><td>Órdenes fuera de 07–21</td><td>Diseñar cobertura 24/7</td></tr><tr><td>Trazabilidad completa</td><td>100% de los casos del PoC reconstruibles</td></tr></table></div><div class="note"><b>Gate:</b> antes del PoC deben cerrarse seguridad, datos mínimos, trazabilidad, responsabilidad y baseline. La arquitectura definitiva puede evolucionar durante Shadow y validación asistida.</div></section>'''
          }
          for sid,new in sections.items():
              pat=rf'<section id="{sid}" class="view">.*?</section>'
              s2,n=re.subn(pat,new,s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'No se pudo reemplazar {sid}: {n}')
              s=s2
          s=s.replace('TABLERO DE TRABAJO · V2.0','TABLERO DE TRABAJO · V2.2')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Restore detailed evidence and analysis" || exit 0
          git push
