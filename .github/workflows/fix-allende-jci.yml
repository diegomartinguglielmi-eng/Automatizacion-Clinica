name: Fix Sanatorio Allende JCI badge
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-allende-jci.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Allende to JCI badge list
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="['Hospital Italiano','Hospital Austral','Hospital Alemán','Hospital Privado Universitario de Córdoba'].includes(r.name)"
          new="['Hospital Italiano','Hospital Austral','Hospital Alemán','Hospital Privado Universitario de Córdoba','Sanatorio Allende'].includes(r.name)"
          if old not in s:
              raise SystemExit('Target JCI list not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show JCI badge for Sanatorio Allende"
          git push
