name: Apply compact sidebar and Otamendi logo V2
on:
  push:
    paths: ['.github/workflows/apply-compact-sidebar-logo-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="brand"><b>Automatización<br>Clínica</b><small>Sanatorio Otamendi · Procesos & Automatizaciones</small></div>'
          new='''<div class="brand"><img class="otamendi-logo" src="logo_otamendi_hq.svg" alt="Sanatorio Otamendi"><b>Automatización<br>Clínica</b><small>Sanatorio Otamendi · Procesos & Automatizaciones</small></div>'''
          if old in s:
              s=s.replace(old,new,1)
          css='''<style id="sidebar-fit-v3">
          @media(min-width:901px){
            .app{grid-template-columns:225px minmax(0,1fr)}
            .side{padding:6px 9px 7px;overflow:hidden;display:flex;flex-direction:column;height:100vh}
            .brand{padding:2px 0 5px;flex:0 0 auto}
            .otamendi-logo{display:block;width:44px;height:44px;object-fit:contain;margin:0 auto 1px;filter:brightness(0) invert(1);opacity:.9}
            .brand b{font-size:14px;line-height:.96;margin:0}
            .brand small{display:block;font-size:6.7px;line-height:1.05;margin-top:3px}
            .nav{flex:1;min-height:0;overflow:hidden;padding-top:2px}
            .nav h4{font-size:7px;line-height:1;margin:5px 5px 2px;letter-spacing:.055em}
            .nav .group{font-size:6.8px;line-height:1;margin:4px 5px 1px;letter-spacing:.035em}
            .nav button{padding:3.2px 6px;font-size:7.9px;line-height:1.02;border-radius:6px;min-height:0;margin:0}
            .nav .analysis{padding-left:13px;font-size:7.4px}
          }
          @media(min-width:901px) and (max-height:850px){
            .app{grid-template-columns:215px minmax(0,1fr)}
            .side{padding:4px 8px}
            .otamendi-logo{width:34px;height:34px;margin-bottom:0}
            .brand{padding:0 0 3px}.brand b{font-size:12.5px}.brand small{font-size:6px;margin-top:2px}
            .nav{padding-top:1px}.nav h4{font-size:6.4px;margin:3.5px 4px 1px}.nav .group{font-size:6.2px;margin:3px 4px 1px}
            .nav button{padding:2.45px 5px;font-size:7.15px;line-height:1}.nav .analysis{font-size:6.8px;padding-left:11px}
          }
          @media(max-width:900px){.otamendi-logo{width:40px;height:40px;object-fit:contain;filter:brightness(0) invert(1);margin-bottom:2px}}
          </style>'''
          marker='</head>'
          if 'id="sidebar-fit-v3"' not in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact sidebar and add Otamendi logo' || exit 0
          git push
