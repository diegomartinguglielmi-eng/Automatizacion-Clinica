name: Build transversal architecture v2
on:
  push:
    paths: ['.github/workflows/build-transversal-architecture-v2.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a=s.index('<section id="architecture" class="view">'); b=s.index('</section></main>',a)
          new='''<section id="architecture" class="view"><div class="arch-screen"><div class="grid g4 arch-pillars"><div class="p-card"><span class="tag">INTEGRACIÓN</span><h3>Un ecosistema conectado</h3><p>Aprovechar ThinkSoft e integrar soluciones clínicas sobre una arquitectura común.</p></div><div class="p-card"><span class="tag">REUTILIZACIÓN</span><h3>Componentes comunes</h3><p>Datos, reglas, motores de riesgo, trazabilidad y servicios compartidos.</p></div><div class="p-card"><span class="tag">SEGURIDAD</span><h3>Gobierno clínico y de datos</h3><p>Roles, auditoría, explicabilidad, JCI y control de excepciones.</p></div><div class="p-card"><span class="tag">ESCALABILIDAD</span><h3>De PoC a plataforma</h3><p>Arquitectura preparada para sumar nuevos procesos sin empezar de cero.</p></div></div><div class="hero arch-hero"><div class="eyebrow">ARQUITECTURA TRANSVERSAL</div><h2>De dos proyectos a una plataforma de automatización clínica</h2><p>TRIAGE IA y Validación Farmacoterapéutica comparten una misma lógica: capturar contexto, ejecutar screening, priorizar riesgo, llevar excepciones al profesional y dejar evidencia auditable.</p><div class="flow"><span class="node">ThinkSoft / fuentes clínicas</span><span class="arrow">→</span><span class="node">Integración + datos</span><span class="arrow">→</span><span class="node">Reglas / CDSS / IA</span><span class="arrow">→</span><span class="node">Risk Engine</span><span class="arrow">→</span><span class="node">Worklists / decisiones</span><span class="arrow">→</span><span class="node">Trazabilidad + métricas</span></div></div><div class="arch-main"><div class="model-wide"><h3>Arquitectura objetivo · vista simplificada</h3><div class="arch-layers"><div class="arch-col"><b>Fuentes de datos</b><span>ThinkSoft · HIS</span><span>Laboratorio</span><span>Órdenes / prescripciones</span><span>Signos vitales / contexto</span><span>Otros sistemas</span></div><div class="arch-core"><b>Plataforma de automatización clínica</b><div class="arch-core-grid"><span>Integración<br><small>API · HL7/FHIR</small></span><span>Repositorio clínico<br><small>datos normalizados</small></span><span>Motor reglas / IA<br><small>CDSS · modelos</small></span></div><div class="arch-band">Orquestación de workflows · TRIAGE · Farmacia · futuros casos</div><div class="arch-band">Trazabilidad y auditoría · logs · métricas · evidencia JCI</div><div class="arch-band green">Seguridad · gobierno · calidad de datos · control de versiones</div></div><div class="arch-col"><b>Aplicaciones / Worklists</b><span>TRIAGE IA</span><span>Validación farmacoterapéutica</span><span>Alertas clínicas</span><span>Reportes / indicadores</span><span>Gestión de excepciones</span></div><div class="arch-col arch-results"><b>Resultados</b><span>Decisiones más seguras</span><span>Menor carga manual</span><span>Intervención por riesgo</span><span>Evidencia auditable</span><span>Escala 24/7</span></div></div></div><div class="model-block"><h3>Casos de uso</h3><div class="compact-list" style="grid-template-columns:1fr"><div class="compact-item"><b>TRIAGE IA · H1</b>IA como primera capa; Enfermería interviene por riesgo, incertidumbre o excepción.</div><div class="compact-item"><b>Validación farmacoterapéutica · F1</b>Screening del 100%; Farmacia concentra juicio en prescripciones priorizadas.</div><div class="compact-item"><b>Expansión futura</b>Deterioro clínico, alertas, soporte a internación, estudios e imágenes y otros procesos.</div></div></div></div><div class="arch-bottom"><div class="model-block"><h3>Componentes transversales</h3><div class="threshold-grid"><div class="threshold"><span>Integración e interoperabilidad</span><b>API · HL7/FHIR</b></div><div class="threshold"><span>Datos y gobernanza</span><b>calidad · roles</b></div><div class="threshold"><span>Reglas y modelos</span><b>CDSS · IA</b></div><div class="threshold"><span>Workflows / worklists</span><b>excepciones</b></div><div class="threshold"><span>Trazabilidad y métricas</span><b>logs · KPI · JCI</b></div><div class="threshold"><span>Seguridad / continuidad</span><b>accesos · downtime</b></div></div></div><div class="model-block"><h3>Principios de diseño</h3><div class="trigger-list"><span class="trigger">Paciente en el centro</span><span class="trigger">Reutilizar antes de desarrollar</span><span class="trigger">Estándares abiertos</span><span class="trigger">Seguridad por diseño</span><span class="trigger">Trazabilidad end-to-end</span><span class="trigger">Gobierno clínico</span><span class="trigger">Escalabilidad incremental</span></div></div><div class="model-block"><h3>Próximos pasos</h3><div class="compact-list" style="grid-template-columns:1fr"><div class="compact-item"><b>1 · Validar arquitectura</b>IT + ThinkSoft: integración y datos disponibles.</div><div class="compact-item"><b>2 · Definir componentes comunes</b>Reglas, datos, Risk Engine, worklists y auditoría.</div><div class="compact-item"><b>3 · Ejecutar los PoC</b>TRIAGE IA + Validación Farmacoterapéutica con métricas comunes.</div><div class="compact-item"><b>4 · Escalar</b>Reutilizar la plataforma en nuevos casos de uso.</div></div></div></div><div class="portfolio-note arch-note"><b>Idea central:</b> no construir dos soluciones aisladas. La arquitectura común debe permitir que TRIAGE y Farmacia compartan integración, datos, gobierno, trazabilidad y capacidad de priorización, manteniendo reglas clínicas y workflows específicos para cada proceso.</div></div></section>'''
          s=s[:a]+new+s[b+10:]
          css='''<style>.arch-screen{height:calc(100vh - 82px);overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:7px}.arch-pillars{margin:0}.arch-pillars .p-card{padding:8px 10px}.arch-pillars .p-card h3{font-size:11px;margin-bottom:2px}.arch-pillars .p-card p{font-size:7px;margin:2px 0}.arch-pillars .tag{font-size:6.5px;padding:3px 5px;margin-bottom:2px}.arch-hero{padding:9px 12px}.arch-hero h2{font-size:17px;margin:3px 0 4px}.arch-hero p{font-size:8px}.arch-hero .flow{margin-top:6px}.arch-hero .node{font-size:6.8px;padding:4px 6px}.arch-main{display:grid;grid-template-columns:3.2fr .8fr;gap:7px;min-height:0}.arch-main>.model-wide,.arch-main>.model-block{padding:8px 10px}.arch-layers{display:grid;grid-template-columns:.75fr 2.2fr .85fr .8fr;gap:6px;margin-top:6px;height:calc(100% - 20px)}.arch-col,.arch-core{border:1px solid var(--line);border-radius:8px;background:#fbf7f8;padding:6px;display:flex;flex-direction:column;gap:4px;font-size:6.8px}.arch-col>b,.arch-core>b{color:var(--brand);font-size:7.5px}.arch-col span{background:#fff;border:1px solid #eee5e7;border-radius:5px;padding:4px}.arch-results span{background:#f2faf6;border-color:#d6eee2;color:#23634b}.arch-core{background:#f5f9fd;border-color:#d7e5ef}.arch-core-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.arch-core-grid span,.arch-band{background:#fff;border:1px solid #d8e7f2;border-radius:6px;padding:6px;text-align:center;font-size:6.8px}.arch-core-grid small{color:var(--muted);font-size:6px}.arch-band.green{background:#eef9f4;border-color:#cbe8d9;color:#176a4d}.arch-bottom{display:grid;grid-template-columns:1.15fr .9fr 1.15fr;gap:7px}.arch-bottom .model-block{padding:7px 9px}.arch-bottom .threshold-grid{margin-top:4px;gap:2px}.arch-bottom .threshold{font-size:6.3px;padding:2px 1px}.arch-bottom .trigger-list{margin-top:4px;gap:3px}.arch-bottom .trigger{font-size:6px;padding:3px 5px}.arch-bottom .compact-list{margin-top:4px;gap:3px}.arch-bottom .compact-item{font-size:6.2px;padding:3px 5px}.arch-note{margin:0;padding:6px 8px;font-size:6.8px}@media(max-width:1000px){.arch-screen{height:auto;overflow:visible}.arch-main,.arch-bottom,.arch-layers{grid-template-columns:1fr}}</style>'''
          s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Expand transversal architecture across both projects' || exit 0
          git push
