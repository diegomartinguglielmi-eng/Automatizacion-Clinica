name: Rename pharmacy demand dimensioning
on:
  push:
    paths:
      - '.github/workflows/rename-demand-dimensioning.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('Demanda & simulador','Demanda & dimensionamiento')
          s=s.replace('Demanda &amp; simulador','Demanda &amp; dimensionamiento')
          if s==old:
              raise SystemExit('No matching labels found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Rename pharmacy demand section to dimensioning"
          git push