name: Refine sidebar hierarchy v2.1
on:
  push:
    paths:
      - '.github/workflows/sidebar-layout-v21.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update sidebar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Add final sidebar override before head close.
          css='''<style id="sidebar-v21">
          .app{grid-template-columns:250px 1fr}
          .side{height:100vh;overflow:hidden;padding:10px 12px 9px;display:flex;flex-direction:column}
          .brand{padding:0 0 8px;border-bottom:1px solid #ffffff35;flex:0 0 auto}
          .brand img{display:block;width:56px;height:56px;object-fit:contain;margin:0 auto 3px;filter:brightness(0) invert(1);opacity:.96}
          .brand b{font-size:19px;line-height:.92;margin:0;font-weight:800}
          .brand small{display:none}
          .nav{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-start}
          .nav h4{font-size:9px;line-height:1.05;margin:7px 7px 2px;letter-spacing:.055em}
          .nav .group{font-size:8.5px;line-height:1;margin:5px 7px 1px;letter-spacing:.025em}
          .nav button{padding:4px 9px;font-size:10.5px;line-height:1.05;min-height:22px}
          .nav .analysis{padding-left:18px;font-size:10px}
          .side-footer{flex:0 0 auto;border-top:1px solid #ffffff45;margin-top:5px;padding:7px 5px 1px;text-align:center;font-size:9.5px;line-height:1.25;color:#fff}
          @media(min-height:850px){.nav h4{font-size:9.5px;margin-top:8px}.nav .group{font-size:9px;margin-top:6px}.nav button{font-size:11px;min-height:24px;padding:4.5px 9px}.nav .analysis{font-size:10.5px}.brand img{width:60px;height:60px}.brand b{font-size:20px}.side-footer{font-size:10px}}
          @media(max-height:760px){.brand img{width:46px;height:46px}.brand b{font-size:17px}.nav h4{font-size:8.2px;margin-top:5px}.nav .group{font-size:7.8px;margin-top:4px}.nav button{font-size:9.4px;min-height:19px;padding:3px 8px}.nav .analysis{font-size:9px}.side-footer{font-size:8.5px;padding-top:5px}}
          </style>'''
          if 'id="sidebar-v21"' not in s:
              s=s.replace('</head>',css+'</head>')
          old='<div class="brand"><b>Automatización<br>Clínica</b><small>Sanatorio Otamendi · Procesos & Automatizaciones</small></div><div class="nav">'
          new='<div class="brand"><img src="logo_otamendi_hq.svg" alt="Sanatorio Otamendi"><b>Automatización<br>Clínica</b></div><div class="nav">'
          if old in s:
              s=s.replace(old,new,1)
          # Footer goes after nav, before aside closes.
          marker='</div></aside><main class="main">'
          repl='</div><div class="side-footer">Sanatorio Otamendi · Procesos &amp; Automatizaciones</div></aside><main class="main">'
          if 'class="side-footer"' not in s:
              s=s.replace(marker,repl,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Refine sidebar layout and typography'
          git push
