name: Build pharma readiness
on:
  push:
    paths: ['.github/workflows/build-pharma-readiness.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a=s.index('<div id="p-pen" class="pharma-sub">'); b=s.index('</section><section id="architecture"',a)
          new='''<div id="p-pen" class="pharma-sub"><div class="hero" style="padding:11px 14px"><div class="eyebrow">READINESS · PUERTA DE ENTRADA AL PoC</div><h2 style="font-size:19px;margin:4px 0 5px">Qué debe estar resuelto antes de iniciar el piloto</h2><p style="font-size:9px">Los pendientes se organizan como condiciones de habilitación. El PoC comienza cuando existe suficiente definición clínica, tecnológica, operativa y de gobernanza para medir seguridad y carga farmacéutica sin introducir riesgo no controlado.</p><div class="flow" style="margin-top:7px"><span class="node">JCI & clínica</span><span class="arrow">→</span><span class="node">TS & datos</span><span class="arrow">→</span><span class="node">Operación</span><span class="arrow">→</span><span class="node">Gobernanza</span><span class="arrow">→</span><span class="node">Economía</span><span class="arrow">→</span><span class="node">GO / NO GO PoC</span></div></div><div class="grid g4" style="margin-top:7px"><div class="p-card" style="padding:8px 10px"><span class="tag">CLÍNICA</span><h3>Reglas y excepciones</h3><p>Qué debe revisar el sistema, qué queda siempre en Farmacia y cómo se tratan alto riesgo y poblaciones especiales.</p></div><div class="p-card" style="padding:8px 10px"><span class="tag">TECNOLOGÍA</span><h3>Capacidad real de TS</h3><p>Confirmar screening, datos disponibles, worklist, priorización, integración y audit trail.</p></div><div class="p-card" style="padding:8px 10px"><span class="tag">OPERACIÓN</span><h3>Baseline medido</h3><p>Prescripciones, distribución horaria, tiempos, intervenciones y carga fuera de cobertura.</p></div><div class="p-card" style="padding:8px 10px"><span class="tag">GOBERNANZA</span><h3>Responsabilidad y evidencia</h3><p>Aprobar roles, contingencias, trazabilidad, criterios de parada y decisión GO / ADJUST / NO GO.</p></div></div><div class="table-wrap" style="margin-top:7px;max-height:calc(100vh - 330px)"><table><thead><tr><th>Dimensión</th><th>Condición para avanzar</th><th>Evidencia / entregable</th><th>Criterio de cierre</th><th>Estado</th></tr></thead><tbody><tr><td class="crit">JCI & clínica</td><td>Aprobar alcance de revisión farmacoterapéutica y traducción operativa de MMU.05.02.</td><td>Matriz JCI → proceso + criterios clínicos de revisión.</td><td>Farmacia / Calidad aprueban alcance, excepciones y responsabilidades.</td><td><span class="st part">En definición</span></td></tr><tr><td class="crit">JCI & clínica</td><td>Definir medicamentos, reglas y poblaciones que nunca podrán atravesar una vía automática sin revisión individual.</td><td>Lista de alto riesgo, pediatría/especiales, alertas críticas y exclusiones F0/F1.</td><td>Listado versionado y aprobado clínicamente.</td><td><span class="st no">Pendiente</span></td></tr><tr><td class="crit">TS / HIS</td><td>Relevar hasta dónde ThinkSoft puede resolver el modelo objetivo antes de incorporar otra plataforma.</td><td>Checklist TS: reglas, alergias/interacciones, renal/hepático, duplicidad, worklist, Risk Score, documentación y APIs.</td><td>Capacidades demostradas en ambiente real + brechas documentadas.</td><td><span class="st no">Crítico</span></td></tr><tr><td class="crit">Datos</td><td>Confirmar disponibilidad y calidad de los datos necesarios para screening contextual.</td><td>Medicaciones, alergias, edad/peso, diagnósticos, laboratorio, función renal/hepática y unidad.</td><td>Dataset mínimo completo y accesible con calidad suficiente para PoC.</td><td><span class="st no">Crítico</span></td></tr><tr><td class="crit">Demanda</td><td>Medir carga real antes de cerrar dotación o metas de automatización.</td><td>Órdenes/día, paciente/día, hora P90, críticas/no críticas y fuera de 07–21.</td><td>Baseline representativo cargado en el simulador.</td><td><span class="st no">Pendiente</span></td></tr><tr><td class="crit">Operación</td><td>Medir tiempo farmacéutico actual e intervenciones.</td><td>Minutos por revisión/intervención, tipo, severidad, aceptación, aclaraciones y retrabajo.</td><td>Distribución de tiempos y KPI baseline aprobados.</td><td><span class="st no">Pendiente</span></td></tr><tr><td class="crit">Modelo F1</td><td>Definir qué ocurre con cada orden después del screening.</td><td>Vía principal, vía de excepción, worklist, SLA, responsable y resolución.</td><td>Circuito TO-BE validado por Farmacia, Procesos y áreas clínicas.</td><td><span class="st part">Diseñado</span></td></tr><tr><td class="crit">Cobertura 24/7</td><td>Definir tratamiento de órdenes fuera de L–V 07–21.</td><td>Reglas de continuidad, cola diferida, excepciones urgentes y escalamiento.</td><td>Ninguna orden crítica queda sin mecanismo de respuesta.</td><td><span class="st no">Pendiente</span></td></tr><tr><td class="crit">Trazabilidad</td><td>Reconstruir de punta a punta cada decisión.</td><td>Input, regla/versión, score, alerta, profesional, intervención, resolución y timestamps.</td><td>100% de episodios del PoC auditables.</td><td><span class="st no">Crítico</span></td></tr><tr><td class="crit">Legal & gobernanza</td><td>Definir responsabilidad clínica, uso de automatización y contingencias.</td><td>Matriz RACI, política de excepción, downtime, cambios de reglas y control de versiones.</td><td>Gobernanza aprobada antes de modificar el workflow asistencial.</td><td><span class="st no">Pendiente</span></td></tr><tr><td class="crit">Proveedor</td><td>Decidir TS nativo vs. TS + motor especializado sobre evidencia, no por catálogo.</td><td>Prueba técnica, integración, evidencia productiva, soporte, SLA y costo.</td><td>Alternativa seleccionada y arquitectura aprobada.</td><td><span class="st part">En análisis</span></td></tr><tr><td class="crit">PoC</td><td>Aprobar diseño, muestra, métricas y criterios de parada.</td><td>Protocolo Shadow → Validación asistida → Gestión por riesgo.</td><td>Metas de seguridad, desempeño y carga aprobadas antes de iniciar.</td><td><span class="st part">Borrador</span></td></tr><tr><td class="crit">Economía</td><td>Construir business case con costo tecnológico y carga humana residual.</td><td>Setup + run + integración + variable + horas/FTE farmacéuticos.</td><td>Costo por prescripción y escenario F3 vs F1 comparables.</td><td><span class="st no">Pendiente</span></td></tr></tbody></table></div><div class="portfolio-note" style="margin-top:7px;padding:7px 9px"><b>Puerta de entrada al PoC:</b> no hace falta cerrar todos los temas del modelo definitivo. Sí deben estar cerrados los que afectan <b>seguridad clínica, datos mínimos, trazabilidad, responsabilidad y medición del baseline</b>. El resto puede validarse progresivamente durante Shadow y Validación asistida.</div></div>'''
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build pharma readiness and pending validations' || exit 0
          git push
