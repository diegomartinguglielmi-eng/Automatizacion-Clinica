name: Use supplied provider logos
on:
  push:
    paths:
      - '.github/workflows/use-shared-provider-logos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install supplied logos and patch provider header
        env:
          TRIAGE_B64: 
          GUARDIA_B64: 
        run: |
          mkdir -p assets/providers
          printf '%s' "$TRIAGE_B64" | base64 -d > assets/providers/triage-oops.png
          printf '%s' "$GUARDIA_B64" | base64 -d > assets/providers/guardia-virtual.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="const d=domainFor(s),logo=d?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(d)+'&sz=128':'';"
          new="const d=domainFor(s),k=(s.id||s.name||'').toLowerCase(),logo=(k.includes('triage')||k.includes('oops'))?'assets/providers/triage-oops.png':k.includes('guardia')?'assets/providers/guardia-virtual.png':(d?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(d)+'&sz=128':'');"
          if old not in s: raise SystemExit('provider logo expression not found')
          s=s.replace(old,new,1)
          s=s.replace('.supplier-logo{width:28px;height:28px;', '.supplier-logo{width:42px;height:32px;',1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/providers/triage-oops.png assets/providers/guardia-virtual.png
          git commit -m "Use supplied TriAge and Guardia Virtual logos"
          git push