name: Refine executive summary two projects
on:
  push:
    paths: ['.github/workflows/refine-executive-summary-two-projects.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a=s.index('<section id="portfolio" class="view active">')
          b=s.index('<section id="triage" class="view">',a)
          new='''<section id="portfolio" class="view active"><div class="hero" style="padding:12px 16px"><div class="eyebrow">RESUMEN EJECUTIVO · PORTFOLIO CLÍNICO</div><h2 style="font-size:20px;margin:4px 0 5px">Dos proyectos, un mismo objetivo: decisiones clínicas más seguras y eficientes</h2><p style="font-size:9px">Aplicar tecnología, reglas clínicas e IA para priorizar el uso del recurso profesional donde realmente aporta valor, mejorando seguridad y eficiencia operativa.</p><div class="flow" style="margin-top:7px"><span class="node">Demanda clínica</span><span class="arrow">→</span><span class="node">Screening digital</span><span class="arrow">→</span><span class="node">Reglas + datos + IA</span><span class="arrow">→</span><span class="node">Priorización</span><span class="arrow">→</span><span class="node">Profesional</span><span class="arrow">→</span><span class="node">Trazabilidad & métricas</span></div></div><div class="unified-summary" style="margin-top:7px"><div class="project-block" style="padding:11px 13px"><span class="tag">PROYECTO 01</span><h3 style="margin-bottom:3px">TRIAGE IA</h3><div style="font-size:8px;color:var(--muted);margin-bottom:7px">Prioriza la atención en urgencias según riesgo clínico.</div><div class="metrics"><div class="m"><b>≈4.000</b><span>episodios/mes</span></div><div class="m"><b>130–150</b><span>pacientes/día</span></div><div class="m"><b>13/h</b><span>P90 horario</span></div><div class="m"><b>20–30%</b><span>hipótesis intervención humana</span></div></div><div class="compact-list" style="margin-top:7px"><div class="compact-item"><b>Alcance</b>Guardia / urgencias.</div><div class="compact-item"><b>Modelo</b>H1 objetivo: IA como primera capa; Enfermería por excepción.</div><div class="compact-item"><b>Impacto a medir</b>Tiempo, seguridad y minutos profesionales por episodio.</div><div class="compact-item"><b>Estado actual</b>Modelo y PoC en diseño; pendientes de validación identificados.</div></div></div><div class="project-block" style="padding:11px 13px"><span class="tag">PROYECTO 02</span><h3 style="margin-bottom:3px">VALIDACIÓN FARMACOTERAPÉUTICA</h3><div style="font-size:8px;color:var(--muted);margin-bottom:7px">Revisa prescripciones y prioriza riesgos o excepciones.</div><div class="metrics"><div class="m"><b>130</b><span>camas</span></div><div class="m"><b>72</b><span>camas críticas</span></div><div class="m"><b>JCI</b><span>driver</span></div><div class="m"><b>TS</b><span>HIS actual</span></div></div><div class="compact-list" style="margin-top:7px"><div class="compact-item"><b>Alcance</b>Internación; alcance operativo a validar.</div><div class="compact-item"><b>Modelo</b>F1 objetivo: screening + priorización + Farmacia por riesgo.</div><div class="compact-item"><b>Impacto a medir</b>Intervenciones, tiempos, seguridad y carga farmacéutica.</div><div class="compact-item"><b>Estado actual</b>Modelo y PoC en diseño; baseline de demanda pendiente.</div></div></div></div><div class="model-bottom" style="margin-top:7px;grid-template-columns:.95fr 1.05fr"><div class="model-block" style="padding:9px 11px"><h3>Comparación del enfoque</h3><div class="threshold-grid" style="margin-top:5px"><div class="threshold"><span>Screening de la demanda</span><b>Ambos proyectos</b></div><div class="threshold"><span>Priorización por riesgo</span><b>H1 / F1</b></div><div class="threshold"><span>Intervención profesional</span><b>Riesgo · excepción · incertidumbre</b></div><div class="threshold"><span>Trazabilidad</span><b>Requisito transversal</b></div><div class="threshold"><span>KPI TRIAGE</span><b>% humano + min/episodio</b></div><div class="threshold"><span>KPI Farmacia</span><b>% intervención + min/prescripción</b></div></div></div><div class="model-block" style="padding:9px 11px"><h3>Próximos pasos del portfolio</h3><div class="compact-list" style="margin-top:5px"><div class="compact-item"><b>1 · Completar baselines</b>Demanda, tiempos y carga profesional de cada proceso.</div><div class="compact-item"><b>2 · Cerrar readiness</b>Seguridad, datos, integración, trazabilidad y gobernanza.</div><div class="compact-item"><b>3 · Ejecutar PoC</b>Shadow / validación controlada antes de modificar el workflow.</div><div class="compact-item"><b>4 · Medir y decidir</b>GO / ADJUST / NO GO con evidencia de seguridad y operación.</div></div></div></div><div class="portfolio-note" style="margin-top:7px;padding:8px 10px"><b>Lectura ejecutiva:</b> el portfolio queda limitado a <b>TRIAGE IA y Validación Farmacoterapéutica</b>. Ambos comparten una arquitectura de screening, priorización y trazabilidad, pero sus beneficios y niveles de automatización deben demostrarse en PoC; no se incorporan otros procesos ni impactos cuantificados sin evidencia.</div></section>'''
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine executive summary to confirmed two-project scope' || exit 0
          git push
