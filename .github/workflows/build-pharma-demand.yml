name: Build pharma demand and staffing model
on:
  push:
    paths: ['.github/workflows/build-pharma-demand.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a=s.index('<div id="p-dem" class="pharma-sub">'); b=s.index('<div id="p-mod" class="pharma-sub">',a)
          new='''<div id="p-dem" class="pharma-sub"><div class="toolbar"><div><h2>Demanda & dotación</h2><div style="font-size:9px;color:var(--muted);margin-top:3px">Pregunta de dimensionamiento: <b style="color:var(--brand)">¿cuánto trabajo requiere realmente juicio farmacéutico?</b></div></div></div><div class="grid g4" style="margin:0 0 8px"><div class="p-card"><span class="tag">BASE CONOCIDA</span><div class="metric">130</div><div class="label">camas totales</div><p>Capacidad institucional de referencia para dimensionar demanda.</p></div><div class="p-card"><span class="tag">COMPLEJIDAD</span><div class="metric">72</div><div class="label">camas críticas</div><p>La criticidad debe pesar en reglas, prioridad y cobertura farmacéutica.</p></div><div class="p-card"><span class="tag">ETAPA INICIAL</span><div class="metric" style="font-size:18px">L–V · 07–21</div><div class="label">cobertura prevista</div><p>Ventana inicial a contrastar contra la distribución real de órdenes.</p></div><div class="p-card"><span class="tag">MODELO OBJETIVO</span><div class="metric">24/7</div><div class="label">cobertura del sistema</div><p>Screening continuo; intervención farmacéutica según riesgo y excepción.</p></div></div><div class="model-shell"><div class="model-wide"><h3>Modelo de carga · de prescripciones a minutos farmacéuticos</h3><div class="model-subtitle">No se fija todavía una dotación: primero hay que medir volumen, concentración horaria y proporción de órdenes que requieren intervención.</div><div class="flow"><span class="node">Prescripciones</span><span class="arrow">→</span><span class="node">Screening TS / motor</span><span class="arrow">→</span><span class="node">Sin hallazgo</span><span class="arrow">→</span><span class="node">Flujo automatizado</span><span class="arrow">→</span><span class="node">Riesgo / excepción</span><span class="arrow">→</span><span class="node">Farmacéutico</span></div></div><div class="model-middle"><div class="model-block"><h3>1 · Datos a medir</h3><div class="compact-list"><div class="compact-item"><b>Órdenes / día</b>Nuevas, modificadas y suspendidas.</div><div class="compact-item"><b>Órdenes / paciente / día</b>Separar áreas críticas y no críticas.</div><div class="compact-item"><b>Distribución horaria</b>Promedio + hora P90 + fuera de 07–21.</div><div class="compact-item"><b>Tipo de orden</b>Rutina, alto riesgo, antimicrobianos, renal, etc.</div><div class="compact-item"><b>Alertas actuales</b>Volumen, severidad y tasa de aceptación.</div><div class="compact-item"><b>Tiempo actual</b>Minutos reales por validación/intervención.</div></div></div><div class="model-block"><h3>2 · Variables del modelo</h3><div class="threshold-grid"><div class="threshold"><span>Prescripciones / día</span><b>A medir</b></div><div class="threshold"><span>% screening automático</span><b>PoC</b></div><div class="threshold"><span>% escaladas a Farmacia</span><b>KPI principal</b></div><div class="threshold"><span>Minutos / escalada</span><b>A medir</b></div><div class="threshold"><span>Órdenes hora P90</span><b>A medir</b></div><div class="threshold"><span>% fuera de cobertura</span><b>A medir</b></div><div class="threshold"><span>% alto riesgo / críticos</span><b>A medir</b></div><div class="threshold"><span>Retrabajo / aclaraciones</span><b>A medir</b></div></div></div><div class="model-block"><h3>3 · Salidas</h3><div class="load-grid"><div class="load-kpi"><strong>n/d</strong><span>escaladas / día</span></div><div class="load-kpi"><strong>n/d</strong><span>minutos farmacéuticos / día</span></div><div class="load-kpi"><strong>n/d</strong><span>horas farmacéuticas / día</span></div><div class="load-kpi"><strong>n/d</strong><span>FTE requerido por franja</span></div></div><div class="model-subtitle" style="margin-top:7px">Se completan cuando exista baseline de prescripciones y tiempos. Evita dimensionar dotación sólo por número de camas.</div></div></div><div class="model-bottom"><div class="model-wide"><h3>Escenarios a comparar</h3><div class="gate-grid"><div class="gate"><b>F3 · Validación sistemática</b>El farmacéutico revisa prácticamente todas las órdenes.<span>Baseline de carga</span></div><div class="gate current"><b>F1 · Priorización por riesgo</b>El sistema hace screening y el farmacéutico concentra tiempo en alertas/excepciones.<span>Hipótesis objetivo</span></div><div class="gate"><b>F0 · Selectivo</b>Categorías de bajo riesgo aprobadas atraviesan reglas gobernadas sin revisión individual.<span>Etapa futura</span></div></div></div><div class="model-wide"><h3>Fórmula de dimensionamiento</h3><div class="threshold-grid"><div class="threshold"><span>Escaladas / día</span><b>Órdenes × % escalado</b></div><div class="threshold"><span>Minutos / día</span><b>Escaladas × min.</b></div><div class="threshold"><span>Horas / día</span><b>Minutos ÷ 60</b></div><div class="threshold"><span>FTE por franja</span><b>Carga ÷ capacidad útil</b></div></div></div></div></div><div class="portfolio-note"><b>Lectura para Otamendi:</b> las <b>130 camas y 72 críticas</b> describen escala y complejidad, pero no alcanzan para definir dotación. El baseline debe medir prescripciones y minutos reales. El indicador que conecta tecnología con dotación será <b>% de prescripciones que requieren intervención farmacéutica + minutos farmacéuticos por prescripción</b>. El objetivo 24/7 puede cubrirse con screening continuo sin asumir que la misma dotación farmacéutica debe estar presente en todas las horas.</div></div>'''
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build pharma demand and staffing model' || exit 0
          git push
