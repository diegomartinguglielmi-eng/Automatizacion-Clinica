name: Map JCI pharmacotherapy framework
on:
  push:
    paths:
      - '.github/workflows/jci-pharma-framework-map.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace JCI tab with standards map
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<div id="p-jci" class="pharma-sub">')
          end=s.index('<div id="p-ben" class="pharma-sub">',start)
          new='''<div id="p-jci" class="pharma-sub"><div class="hero"><div class="eyebrow">JCI · HOSPITALS 8TH EDITION · MARCO APLICABLE</div><h2>El proyecto debe demostrar el circuito completo de seguridad de la medicación</h2><p>La validación farmacoterapéutica se apoya principalmente en Medication Management and Use (MMU). Para el diseño del proceso, el núcleo es la calidad de la orden, la revisión de adecuación, la dispensación segura, el monitoreo y la evidencia auditable.</p><div class="flow"><span class="node">MMU.04 · Ordenar</span><span class="arrow">→</span><span class="node">MMU.05.02 · Revisar</span><span class="arrow">→</span><span class="node">MMU.05.03 · Dispensar</span><span class="arrow">→</span><span class="node">MMU.06 · Administrar</span><span class="arrow">→</span><span class="node">MMU.07 · Monitorear</span></div></div><div class="grid g4"><div class="p-card"><span class="tag">NÚCLEO</span><h3>MMU.04.00–04.02</h3><p><b>Ordering & Transcribing.</b> Define quién puede prescribir, prácticas seguras, elementos de una orden completa y reconciliación de medicación.</p></div><div class="p-card"><span class="tag">CRÍTICO</span><h3>MMU.05.02</h3><p><b>Appropriateness review.</b> Las prescripciones u órdenes de medicación deben ser revisadas por adecuación. Es el estándar directamente conectado con la validación farmacoterapéutica.</p></div><div class="p-card"><span class="tag">CIRCUITO</span><h3>MMU.05.00 / 05.03</h3><p><b>Preparing & Dispensing.</b> Vincula la revisión con una preparación y dispensación segura: medicamento, dosis, paciente y momento correctos.</p></div><div class="p-card"><span class="tag">RESULTADO</span><h3>MMU.06–07</h3><p><b>Administration & Monitoring.</b> Extiende el control hacia administración segura, respuesta clínica, efectos adversos, errores y mejora del proceso.</p></div></div><div class="model-wide" style="margin-top:9px"><h3>Matriz de trazabilidad JCI → proyecto Otamendi</h3><div class="model-subtitle">La acreditación se traduce en controles, responsables y evidencia verificable; no en una dotación fija.</div><div class="table-wrap" style="margin-top:8px;max-height:330px"><table><thead><tr><th>Estándar / bloque</th><th>Qué condiciona</th><th>Aplicación al proyecto</th><th>Evidencia esperada</th><th>Estado</th></tr></thead><tbody><tr><td><b>MMU.04.00</b></td><td>Profesionales autorizados para prescribir/ordenar.</td><td>Definir origen válido de las órdenes que ingresan al motor de validación.</td><td>Roles, permisos y política de prescripción.</td><td><span class="st part">Validar</span></td></tr><tr><td><b>MMU.04.01</b></td><td>Prácticas seguras y elementos de una orden completa.</td><td>Datos mínimos para que reglas/IA puedan evaluar una prescripción.</td><td>Dataset mínimo, validaciones y manejo de datos faltantes.</td><td><span class="st part">Crítico</span></td></tr><tr><td><b>MMU.04.02</b></td><td>Reconciliación de medicación.</td><td>Incorporar medicación previa y transiciones cuando impacten la evaluación.</td><td>Flujo de reconciliación e integración de antecedentes.</td><td><span class="st part">Validar alcance</span></td></tr><tr><td><b>MMU.05.02</b></td><td>Revisión de adecuación de prescripciones/órdenes.</td><td>Núcleo del proyecto: reglas clínicas + priorización + revisión farmacéutica según riesgo.</td><td>Criterios de revisión, excepciones, intervención y resolución trazadas.</td><td><span class="st no">Prioridad 1</span></td></tr><tr><td><b>MMU.05.03</b></td><td>Dispensación segura.</td><td>Definir cómo el resultado de validación habilita, condiciona o escala la dispensación.</td><td>Estados, timestamps, bloqueos/alertas y auditoría.</td><td><span class="st part">Diseñar</span></td></tr><tr><td><b>MMU.06</b></td><td>Administración segura por personal calificado.</td><td>Asegurar continuidad de información entre validación y administración.</td><td>Registro de administración y acceso a información relevante.</td><td><span class="st na">Interfaz</span></td></tr><tr><td><b>MMU.07</b></td><td>Monitoreo del efecto y seguridad de la medicación.</td><td>Retroalimentar alertas, eventos e intervenciones para mejorar reglas y priorización.</td><td>KPI, eventos adversos, errores, aceptación de intervenciones y resultados.</td><td><span class="st part">Diseñar KPI</span></td></tr><tr><td><b>QPS / calidad</b></td><td>Medición y mejora de procesos de seguridad.</td><td>Evaluar desempeño del modelo, ruido de alertas y riesgos residuales.</td><td>Indicadores, revisión periódica y acciones de mejora.</td><td><span class="st part">Transversal</span></td></tr><tr><td><b>Gestión de información</b></td><td>Integridad, disponibilidad, confidencialidad y trazabilidad.</td><td>Integración HIS, logs y reconstrucción completa de cada validación.</td><td>Audit trail end-to-end y controles de acceso.</td><td><span class="st no">Crítico</span></td></tr></tbody></table></div></div><div class="model-bottom" style="margin-top:9px"><div class="model-block"><h3>Qué debe demostrar el proyecto</h3><div class="compact-list"><div class="compact-item"><b>Orden evaluable</b>Datos clínicos y farmacológicos suficientes y confiables.</div><div class="compact-item"><b>Revisión apropiada</b>Reglas, priorización y juicio farmacéutico en los casos definidos.</div><div class="compact-item"><b>Excepciones controladas</b>Urgencia, contingencia y escenarios especiales documentados.</div><div class="compact-item"><b>Trazabilidad</b>Qué evaluó el sistema, qué hizo el farmacéutico y cuál fue la resolución.</div></div></div><div class="model-block"><h3>Decisiones que JCI no fija</h3><div class="compact-list"><div class="compact-item"><b>Dotación</b>No define una relación automática camas/farmacéutico.</div><div class="compact-item"><b>Horario único</b>El esquema de cobertura debe justificarse por riesgo y operación.</div><div class="compact-item"><b>Tecnología</b>No prescribe un proveedor o una arquitectura específica.</div><div class="compact-item"><b>Automatización</b>Debe demostrarse que el diseño conserva seguridad y responsabilidad clínica.</div></div></div></div><div class="portfolio-note"><b>Lectura para Otamendi:</b> el estándar central para este proyecto es <b>MMU.05.02</b>, conectado hacia atrás con calidad/completitud de la orden (MMU.04) y hacia adelante con dispensación, administración, monitoreo y trazabilidad. El PoC deberá producir evidencia utilizable para esa cadena completa.</div></div>'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Map JCI 8th edition standards to pharmacotherapy validation'
          git push
