name: Build pharma providers 2026
on:
  push:
    paths: ['.github/workflows/pharma-providers-2026.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a=s.index('<div id="p-prov" class="pharma-sub">'); b=s.index('<div id="p-dem" class="pharma-sub">',a)
          new='''<div id="p-prov" class="pharma-sub"><div class="hero"><div class="eyebrow">VALIDACIÓN FARMACOTERAPÉUTICA · PROVEEDORES</div><h2>Primero determinar hasta dónde puede llegar ThinkSoft; después decidir qué capacidad externa hace falta</h2><p>ThinkSoft es el HIS actual y se incorpora como alternativa base. La comparación separa soporte de decisión, vigilancia/priorización y autoverificación selectiva; ninguna solución se considera F0 sólo por disponer de alertas o CDS.</p><div class="flow"><span class="node">TS · HIS actual</span><span class="arrow">→</span><span class="node">Prescripción + datos clínicos</span><span class="arrow">→</span><span class="node">Reglas / CDS</span><span class="arrow">→</span><span class="node">Riesgo</span><span class="arrow">→</span><span class="node">Priorizar / escalar</span><span class="arrow">→</span><span class="node">Farmacéutico</span></div></div><div class="grid g4"><div class="p-card"><span class="tag">ALTERNATIVA 0</span><h3>Evolución sobre TS</h3><p>Validar qué puede configurarse o desarrollarse sobre el HIS antes de incorporar otra plataforma.</p></div><div class="p-card"><span class="tag">CLÍNICA</span><h3>Cobertura de riesgo</h3><p>Dosis, función renal/hepática, alergias, interacciones, duplicidad y medicamentos de alto riesgo.</p></div><div class="p-card"><span class="tag">WORKFLOW</span><h3>Priorizar + documentar</h3><p>Cola farmacéutica por riesgo, intervención, resolución y trazabilidad auditable.</p></div><div class="p-card"><span class="tag">ECONOMÍA</span><h3>Costo incremental</h3><p>Comparar evolución de TS contra setup, integración, licencia y carga humana de soluciones externas.</p></div></div><div class="table-wrap" style="max-height:calc(100vh - 330px);margin-top:8px"><table><thead><tr><th>Criterio</th><th>ThinkSoft / TS</th><th>Sentri7 Pharmacy</th><th>FDB MedKnowledge</th><th>Medi-Span</th><th>UpToDate Lexidrug</th><th>DoseMeRx</th></tr></thead><tbody><tr><td class="crit">Rol principal</td><td><b>HIS actual · alternativa base</b></td><td>Vigilancia clínica + priorización</td><td>Motor de contenido / CDS</td><td>Contenido / CDS</td><td>Referencia + decisión clínica</td><td>Dosificación de precisión</td></tr><tr><td class="crit">Nivel analítico</td><td><span class="st part">F1/F2 potencial · validar</span></td><td><span class="st ok">F1 fuerte</span></td><td><span class="st part">F2</span></td><td><span class="st part">F2</span></td><td><span class="st part">F2</span></td><td><span class="st part">F2 especializado</span></td></tr><tr><td class="crit">Prescripción electrónica</td><td><span class="st ok">Nativa</span></td><td>Consume orden desde EHR</td><td>Se integra al sistema prescriptor</td><td>Se integra al sistema prescriptor</td><td>Soporte al profesional</td><td>Se integra para dosing</td></tr><tr><td class="crit">Datos clínicos del paciente</td><td><b>Ventaja: datos nativos del HIS</b></td><td>Requiere integración EHR</td><td>Requiere datos desde HIS</td><td>Requiere datos desde HIS</td><td>Uso contextual según integración</td><td>Datos clínicos para TDM</td></tr><tr><td class="crit">Screening clínico</td><td>Interacciones y alergias publicadas; dosis, renal/hepático, duplicidad y alto riesgo a relevar</td><td>Reglas sobre datos EHR; renal, anticoagulación, IV→PO, alto riesgo</td><td>Interacciones, alergias, duplicidad, contraindicaciones, dosis y función orgánica</td><td>Amplio contenido farmacológico; alcance exacto a validar</td><td>Información farmacológica basada en evidencia</td><td>Dosis individualizada / TDM; alcance acotado</td></tr><tr><td class="crit">Priorización por riesgo</td><td><span class="st part">A validar con TS</span></td><td><b>Sí · capacidad central</b></td><td>Depende de implementación en HIS/CDS</td><td>Depende de implementación</td><td>No es su función central</td><td>En su dominio terapéutico</td></tr><tr><td class="crit">Workflow farmacéutico</td><td><span class="st part">Cola, intervención y resolución a relevar</span></td><td>Cola, alertas, intervención y analytics</td><td>Debe integrarse al workflow del HIS</td><td>Debe integrarse al workflow</td><td>Consulta profesional</td><td>Workflow de dosing</td></tr><tr><td class="crit">Autoverificación F0</td><td><span class="st na">No confirmada · evaluar desarrollo/reglas</span></td><td>No confirmada como función estándar</td><td>No por sí solo</td><td>No por sí solo</td><td>No</td><td>No</td></tr><tr><td class="crit">Interoperabilidad</td><td><span class="st ok">Ventaja nativa</span><br>HL7/FHIR publicado; alcance local a validar</td><td>Validar interfaces/datos con TS</td><td>Validar licencia + integración con TS</td><td>Validar con TS</td><td>Validar con TS</td><td>Validar con TS</td></tr><tr><td class="crit">Trazabilidad / JCI</td><td><b>Ventaja potencial por residir en HIS</b><br>Registro de alerta, acción y resolución a relevar</td><td>Documenta intervenciones, analytics y soporte de compliance</td><td>El HIS debe registrar alerta/acción/resolución</td><td>Depende del sistema integrador</td><td>Soporte a decisión; trazabilidad depende del HIS</td><td>Trazabilidad del proceso de dosificación</td></tr><tr><td class="crit">Evidencia hospitalaria</td><td><span class="st part">Capacidades publicadas; modelo F1/F0 local no demostrado</span></td><td><span class="st ok">Producto hospitalario consolidado</span></td><td><span class="st ok">Contenido ampliamente integrado</span></td><td><span class="st ok">Enterprise</span></td><td><span class="st ok">Enterprise</span></td><td><span class="st ok">Uso hospitalario especializado</span></td></tr><tr><td class="crit">Costo</td><td><b>Costo incremental a cotizar</b><br>Config./desarrollo vs nueva licencia</td><td>Cotizar enterprise</td><td>Cotizar licencia/integración</td><td>Cotizar enterprise</td><td>Cotizar enterprise</td><td>Cotizar</td></tr><tr><td class="crit">Brecha para Otamendi</td><td>Demostrar si TS puede construir cola F1, reglas clínicas contextualizadas, documentación farmacéutica y eventualmente categorías F0 gobernadas</td><td>Confirmar integración TS y si permite avanzar de F1 hacia reglas F0 gobernadas</td><td>Necesita capa de workflow/priorización para evitar alertas sin gestión</td><td>Confirmar capacidades concretas y workflow local</td><td>No sustituye motor de vigilancia/priorización</td><td>No cubre validación farmacoterapéutica general</td></tr></tbody></table></div><div class="portfolio-note"><b>Lectura para Otamendi:</b> la primera alternativa a evaluar es <b>TS como plataforma base</b>. El RFI debe determinar si puede resolver screening contextual, priorización F1, cola farmacéutica, intervención y trazabilidad con los datos que ya residen en el HIS. Si existe una brecha clínica o funcional, el modelo preferente pasa a ser <b>TS como orquestador + motor especializado externo</b>, evitando sumar una plataforma completa cuando sólo se necesita contenido clínico o vigilancia avanzada. KPI común: <b>% de prescripciones que requieren intervención farmacéutica + minutos farmacéuticos por prescripción.</b></div></div>'''
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add ThinkSoft as pharma baseline solution' || exit 0
          git push
