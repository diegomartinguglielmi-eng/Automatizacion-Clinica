name: Build pharma providers 2026
on:
  push:
    paths: ['.github/workflows/pharma-providers-2026.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a=s.index('<div id="p-prov" class="pharma-sub">'); b=s.index('<div id="p-dem" class="pharma-sub">',a)
          new='''<div id="p-prov" class="pharma-sub"><div class="toolbar"><div><h2>Comparativa de proveedores</h2><div style="font-size:9px;color:var(--muted);margin-top:3px">Objetivo de evaluación: <b style="color:var(--brand)">F1 · priorización automatizada + intervención farmacéutica por riesgo</b></div></div></div><div class="grid g4" style="margin:0 0 8px"><div class="p-card"><span class="tag">AUTOMATIZACIÓN</span><h3>F0–F4 demostrado</h3><p>Distinguir alertas/CDS de automatización real del proceso de validación.</p></div><div class="p-card"><span class="tag">SEGURIDAD</span><h3>Intervención farmacéutica</h3><p>Medir qué porcentaje de prescripciones consume juicio y tiempo farmacéutico.</p></div><div class="p-card"><span class="tag">EVIDENCIA</span><h3>Producción comparable</h3><p>Separar capacidad publicada, piloto y operación hospitalaria productiva.</p></div><div class="p-card"><span class="tag">ECONOMÍA</span><h3>Costo por prescripción</h3><p>Setup + run + integración + variable + costo farmacéutico residual.</p></div></div><div class="table-wrap" style="max-height:calc(100vh - 245px)"><table><thead><tr><th>Criterio</th><th>ThinkSoft / TS<br><span style="font-size:7px;color:var(--muted)">HIS ACTUAL</span></th><th>Sentri7 Pharmacy</th><th>FDB MedKnowledge</th><th>Medi-Span</th><th>UpToDate Lexidrug</th><th>DoseMeRx</th></tr></thead><tbody><tr><td class="crit">Nivel de automatización F0–F4</td><td><span class="st part">F1/F2 potencial · validar</span></td><td><span class="st ok">F1 fuerte</span></td><td><span class="st part">F2</span></td><td><span class="st part">F2</span></td><td><span class="st part">F2</span></td><td><span class="st part">F2 especializado</span></td></tr><tr><td class="crit">Intervención farmacéutica</td><td>Modelo actual y capacidad de gestión por excepción a relevar</td><td>Farmacéutico sobre alertas/pacientes priorizados</td><td>Depende del workflow implementado en el HIS</td><td>Depende del workflow implementado</td><td>Consulta y decisión profesional</td><td>Intervención en terapias bajo TDM/dosing</td></tr><tr><td class="crit">Evidencia de implementación</td><td>HIS productivo en Otamendi; F1/F0 local no demostrado</td><td>Producto hospitalario consolidado de vigilancia clínica</td><td>Contenido/CDS ampliamente integrado en sistemas clínicos</td><td>Solución enterprise de contenido farmacológico</td><td>Referencia/decisión clínica enterprise</td><td>Uso hospitalario especializado en dosificación</td></tr><tr><td class="crit">Integración / interoperabilidad</td><td><b>Ventaja nativa</b> · datos del HIS; HL7/FHIR publicado, alcance local a validar</td><td>Requiere interfaces y datos desde TS</td><td>Requiere integración/licencia con TS</td><td>Requiere integración con TS</td><td>Integración a validar</td><td>Integración a validar</td></tr><tr><td class="crit">Screening clínico</td><td>Interacciones y alergias publicadas; dosis, renal/hepático, duplicidad y alto riesgo a relevar</td><td>Renal, anticoagulación, IV→PO, alto riesgo y reglas sobre EHR</td><td>Interacciones, alergias, duplicidad, contraindicaciones, dosis y función orgánica</td><td>Contenido farmacológico amplio; alcance exacto a validar</td><td>Información farmacológica basada en evidencia</td><td>Dosis individualizada / TDM</td></tr><tr><td class="crit">Priorización por riesgo</td><td><span class="st part">A validar</span></td><td><span class="st ok">Sí · capacidad central</span></td><td>Depende de la capa de workflow</td><td>Depende de implementación</td><td>No es función central</td><td>En su dominio terapéutico</td></tr><tr><td class="crit">Workflow / trazabilidad</td><td>Cola, intervención, resolución y evidencia JCI a relevar</td><td>Cola, alertas, intervención y analytics</td><td>El HIS debe registrar alerta/acción/resolución</td><td>Depende del sistema integrador</td><td>Trazabilidad depende del HIS</td><td>Trazabilidad del proceso de dosing</td></tr><tr><td class="crit">Autoverificación selectiva F0</td><td>No confirmada · evaluar reglas/desarrollo</td><td>No confirmada como función estándar</td><td>No por sí solo</td><td>No por sí solo</td><td>No</td><td>No</td></tr><tr><td class="crit">Costo enterprise</td><td>Costo incremental a cotizar · configuración/desarrollo</td><td>No público · cotizar enterprise</td><td>No público · cotizar licencia + integración</td><td>No público · cotizar enterprise</td><td>No público · cotizar enterprise</td><td>No público · cotizar</td></tr><tr><td class="crit">Brecha principal para Otamendi</td><td>Demostrar si TS puede resolver cola F1, reglas contextualizadas, documentación farmacéutica y categorías F0 gobernadas</td><td>Confirmar integración TS y capacidad de evolución F1→F0</td><td>Necesita workflow/priorización para evitar alertas sin gestión</td><td>Confirmar capacidades y workflow local</td><td>No sustituye motor de vigilancia/priorización</td><td>No cubre validación farmacoterapéutica general</td></tr></tbody></table></div><div class="portfolio-note"><b>Lectura para Otamendi:</b> comenzar por <b>TS como alternativa base</b>. Si no alcanza para screening contextual + priorización F1 + workflow farmacéutico + trazabilidad, evaluar <b>TS + motor especializado</b>. KPI común: <b>% de prescripciones que requieren intervención farmacéutica + minutos farmacéuticos por prescripción.</b></div></div>'''
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Align pharma providers with triage visual style' || exit 0
          git push
