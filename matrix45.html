<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz 45 casos</title><link rel="stylesheet" href="benchmark45.css"><style>:root{--bg:#fbf9f9;--text:#251d20;--muted:#75686c;--line:#eadfe1;--brand:#7c1420;--green:#1aa36b}*{box-sizing:border-box}body{margin:0;padding:4px;font-family:Inter,Segoe UI,Arial,sans-serif;background:#fff;color:var(--text)}.st{display:inline-block;border-radius:999px;padding:3px 6px;font-size:7.5px;font-weight:700}.ok{background:#eaf8f1;color:#1e9e63}.part{background:#fff5da;color:#a66d00}.crit{font-weight:700;color:#51242b}.matrix-title{display:flex;justify-content:space-between;align-items:end;margin:2px 0 8px}.matrix-title h3{margin:0;color:var(--brand);font-size:14px}.matrix-title span{font-size:8px;color:var(--muted)}.bench-filters{margin-top:0}.bench-table{max-height:520px}.bench-table table{font-size:7.5px}.jci-seal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4a6,#e0a814 62%,#a97700);border:1px solid #b17c00;box-shadow:inset 0 0 0 2px #ffe889;color:#704b00;font-size:6px;font-weight:900}</style></head><body><div class="matrix-title"><h3>Matriz completa · 45 casos</h3><span>Filtrá por región, autonomía, IA, estado o acreditación JCI</span></div><div class="bench-filters"><button class="bf active" data-filter="all">Todos (45)</button><button class="bf" data-filter="Argentina">Argentina</button><button class="bf" data-filter="LATAM">LATAM</button><button class="bf" data-filter="Internacional">Internacional</button><button class="bf" data-filter="JCI">Solo JCI</button><button class="bf" data-filter="H0/H1">H0/H1</button><button class="bf" data-filter="H2">H2</button><button class="bf" data-filter="H3">H3</button><button class="bf" data-filter="IA">Con IA</button><button class="bf" data-filter="Productivo">Productivo</button><button class="bf" data-filter="Piloto">Piloto</button><input id="benchSearch" class="bench-search" placeholder="Buscar institución, país o proveedor..."></div><div class="table-wrap bench-table"><table><thead><tr><th>#</th><th>Institución / establecimiento</th><th>País</th><th>JCI</th><th>Estado</th><th>IA</th><th>Virtual</th><th>H0–H4</th><th>Humano obligatorio</th><th>Perfil</th><th>% humano</th><th>Protocolo / modelo</th><th>Evidencia</th></tr></thead><tbody id="bench45Body"></tbody></table></div><script src="benchmark45.js"></script></body></html>
